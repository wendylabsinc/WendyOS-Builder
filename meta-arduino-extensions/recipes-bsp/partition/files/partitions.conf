# WendyOS A/B partition layout for the Arduino UNO Q (eMMC).
#
# eMMC has one GPT, so the boot firmware partitions are declared here too,
# copied from the GPT and file list of Arduino's own UNO Q boot firmware
# (firmware-arduino-uno-q-boot): ABL loads Arduino's U-Boot from boot_a/boot_b.
# The CDT and the radio addresses stay in the eMMC boot partitions, which the
# flash never writes.
#
# The tail is WendyOS's, in the Dragonwing order with data last so the flash
# grows it over the disk. rootfsA/rootfsB --size must equal
# WENDYOS_ROOTFS_SIZE_KB.

--disk --type=emmc --size=76841669632 --write-protect-boundary=65536 --sector-size-in-bytes=512 --grow-last-partition

