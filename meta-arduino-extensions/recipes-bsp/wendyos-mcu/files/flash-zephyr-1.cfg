reset_config srst_only srst_nogate srst_push_pull connect_assert_srst
if {$::tcl_platform(platform) eq "windows"} {
	set null_device NUL
} else {
	set null_device /dev/null
}
init
reset halt
flash info 0
log_output $null_device
if {[catch {flash verify_image ${filename0}}] != 0} {
	log_output default
	flash write_image erase ${filename0}
	echo "wendy-mcu: loader written"
	if {[catch {flash verify_image ${filename0}}] != 0} {
		echo "wendy-mcu: loader verify failed"
		shutdown error
	}
}
log_output $null_device
if {[catch {flash verify_image ${filename1} ${sketch_addr} bin}] != 0} {
	log_output default
	flash write_image erase ${filename1} ${sketch_addr} bin
	echo "wendy-mcu: sketch written"
	if {[catch {flash verify_image ${filename1} ${sketch_addr} bin}] != 0} {
		echo "wendy-mcu: sketch verify failed"
		shutdown error
	}
}
log_output default
source [find resume-zephyr-1.cfg]
