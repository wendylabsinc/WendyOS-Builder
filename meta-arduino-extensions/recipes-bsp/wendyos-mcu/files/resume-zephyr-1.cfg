# Restarts the MCU after OpenOCD halted it: the end of a flash, or on its own
# after a failed one.
# Keep the firmware DWT/MON_EN setup and clear DHCSR.C_DEBUGEN left set by
# OpenOCD, so DWT null pointer hits raise DebugMonitor instead of halting.
reset halt
resume
sleep 100
mww 0x40036400 0xCAFFEEEE
mww 0xE000EDF0 0xA05F0000
# A flash is only good if the core runs afterwards: not locked up (DHCSR) and
# no fault taken (HFSR, CFSR).
sleep 1500
set dhcsr [mrw 0xE000EDF0]
set hfsr [mrw 0xE000ED2C]
set cfsr [mrw 0xE000ED28]
echo [format "wendy-mcu: state dhcsr=%08x hfsr=%08x cfsr=%08x" $dhcsr $hfsr $cfsr]
if {($dhcsr & 0x000A0000) != 0 || ($hfsr & 0x40000002) != 0 || $cfsr != 0} {
	echo "wendy-mcu: not running"
	shutdown error
}
shutdown
