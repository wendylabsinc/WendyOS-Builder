# WendyOS Arduino board support, layered only for the arduino-* boards (see
# conf/template/include/bblayers/arduino.inc). The Qualcomm boot, flash and OTA
# pieces it builds on come from meta-qcom-extensions.
BBPATH:prepend := "${LAYERDIR}:"

BBFILES += " \
    ${LAYERDIR}/recipes-*/*/*.bb \
    ${LAYERDIR}/recipes-*/*/*.bbappend \
    "

BBFILE_COLLECTIONS += "wendyos-arduino"
BBFILE_PATTERN_wendyos-arduino := "^${LAYERDIR}/"
BBFILE_PRIORITY_wendyos-arduino = "52"

LAYERSERIES_COMPAT_wendyos-arduino = "wrynose blacksail"
LAYERVERSION_wendyos-arduino = "1"
LAYERDEPENDS_wendyos-arduino = "core wendyos wendyos-qcom"
