# Raspberry Pi 5 (BCM2712): one image boots from SD or NVMe.

# PCIe is brought up only when booting from NVMe (see the bootcmd below).
# CONFIG_USE_PREBOOT is not set

CONFIG_NVME=y
CONFIG_NVME_PCI=y
CONFIG_CMD_NVME=y

# Boot the SD's boot.scr when it has one, else the NVMe's. devtype/devnum tell
# boot.scr which device it came from.
CONFIG_BOOTCOMMAND="if test -e mmc 0:1 boot.scr; then setenv devtype mmc; else pci enum; nvme scan; setenv devtype nvme; fi; setenv devnum 0; load ${devtype} ${devnum}:1 ${scriptaddr} boot.scr && source ${scriptaddr}"
