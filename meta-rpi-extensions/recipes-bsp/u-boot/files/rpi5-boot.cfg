# Raspberry Pi 5 (BCM2712) boot path: one image boots from SD or NVMe.
#
# No preboot: the stock "pci enum; usb start" hangs some Pi 5 boards before
# boot.scr runs. U-Boot cannot reach the USB ports anyway (they sit behind RP1,
# which it has no driver for). Re-check on those boards before enabling it.
# CONFIG_USE_PREBOOT is not set

CONFIG_NVME=y
CONFIG_NVME_PCI=y
CONFIG_CMD_NVME=y

# "bootflow scan" never tries NVMe. Boot the SD's boot.scr when it has one, so an
# SD boot never touches PCIe (SD first, like the EEPROM's BOOT_ORDER), else the
# NVMe's. devtype/devnum tell boot.scr which device it came from.
CONFIG_BOOTCOMMAND="if test -e mmc 0:1 boot.scr; then setenv devtype mmc; else pci enum; nvme scan; setenv devtype nvme; fi; setenv devnum 0; load ${devtype} ${devnum}:1 ${scriptaddr} boot.scr && source ${scriptaddr}"
