# Fallback CMA pool for the Pi 4, used only when the device tree's linux,cma
# reservation fails: kernel/dma/contiguous.c reserves this size only when no
# device-tree default pool exists, so a healthy boot is unaffected.
#
# The fix for that failure is the fdt_high bound in boot.scr. boot.scr lives
# on the boot partition, and an OTA rewrites only the rootfs slot, so a device
# updated over the air keeps the old boot.scr and keeps failing the reservation
# until it is reflashed. This kernel ships in the rootfs slot, so OTA delivers
# it. With it, those devices get 256 MB instead of the 5 MB bcm2711_defconfig
# default.
#
# The kernel places this pool top-down below the 1 GB DMA limit. On an affected
# 8 GB Pi 4 it put the 5 MB pool at 0x3a800000, which leaves about 430 MB of
# free space down to the DTB at 512 MB. 256 MB fits with margin.
CONFIG_CMA_SIZE_MBYTES=256
