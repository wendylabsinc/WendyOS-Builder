# Pi 4 CMA pool for when the device tree's linux,cma reservation fails; the
# kernel ignores this size whenever the device tree provides a pool. Devices
# updated over the air keep the old boot.scr, so this kernel is what gives them
# a usable pool. It must still fit between the misplaced DTB and the 1 GB DMA
# limit.
CONFIG_CMA_SIZE_MBYTES=256
