BBPATH:prepend := "${LAYERDIR}:"

BBFILES += " \
    ${LAYERDIR}/recipes-*/*/*.bb \
    ${LAYERDIR}/recipes-*/*/*.bbappend \
    "

BBFILE_COLLECTIONS += "wendyos-rpi"
BBFILE_PATTERN_wendyos-rpi := "^${LAYERDIR}/"
BBFILE_PRIORITY_wendyos-rpi = "51"

# blacksail is the tree every RPi board (rpi3-sd, rpi4-sd, rpi5-sd, rpi5-nvme)
# builds on; wrynose stays in the set as the fallback series. The compat check
# only needs an intersection with oe-core's active series.
LAYERSERIES_COMPAT_wendyos-rpi = "wrynose blacksail"
LAYERVERSION_wendyos-rpi = "1"
LAYERDEPENDS_wendyos-rpi = "core wendyos"
