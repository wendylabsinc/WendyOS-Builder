[Unit]
# /var/lib/containerd is a bind mount from /data (var-lib-containerd.mount).
# containerd.service only ordered After= it, so when data.mount failed on a
# boot containerd came up silently on the OS root slot and filled it
# (WDY-3127). RequiresMountsFor turns that into a failed unit instead:
# Requires= + After= on var-lib-containerd.mount where that unit exists,
# and on -.mount (always active) on images without a /data partition.
RequiresMountsFor=/var/lib/containerd
