[Unit]
# Wait for the raw /data partition before the resolver looks at it.
#
# The name used is the GPT partition name, not the /dev/wendyos/data alias.
# Rule 1 of 99-wendyos-data.rules excludes crypto_LUKS, so the alias is dropped
# the moment the partition becomes a LUKS container, and on an encrypted device
# it points at the unlocked mapper -- which is exactly what THIS service
# produces, so waiting on the alias would be circular. The GPT partition name
# is the only name that is valid in all three states: plain, converting and
# encrypted.
#
# It has to be a device dependency and not ConditionPathExists=: conditions are
# evaluated when the job runs, which races udev's coldplug of the disk.
# wendyos-data-init.service:8-16 records what losing that race cost there --
# the first-boot format was skipped and the failure cascaded into WDY-1888.
#
# It is a drop-in rather than lines in the unit because it ships only on GPT
# boards. raspberrypi3-64 is MBR (conf/machine/raspberrypi3-64-wendyos.conf:14
# -> rpi-wendy-ab-mbr.wks:44, `--ptable msdos`), so the device can never appear
# there, and systemd puts a default timeout on device jobs (systemd
# src/core/device.c:129, "in contrast to all other unit types we timeout jobs
# waiting for devices by default"). That is 90 seconds added to every boot, and
# since this service is Before=data.mount, /data would be late by the same 90
# seconds. rpi3 needs no wait at all: C21 puts it permanently out of encryption
# scope, and the script exits immediately when the device is absent.
#
# A drop-in can only ADD dependencies, never remove them, which is why the base
# unit carries none of its own.
Wants=dev-disk-by\x2dpartlabel-data.device
After=dev-disk-by\x2dpartlabel-data.device
