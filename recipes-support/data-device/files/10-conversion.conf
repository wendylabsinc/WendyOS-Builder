[Unit]
# Skip the /data mount outright while a conversion is in progress (C38).
#
# During the conversion the partition becomes crypto_LUKS, udev re-probes it,
# rule 1 of 99-wendyos-data.rules stops matching and /dev/wendyos/data is
# removed. Without this condition the mount would sit waiting for a device that
# is never coming back, fail on its 90-second timeout and take its dependency
# chain with it. It also covers an interrupted conversion, whose surviving
# marker keeps the mount skipped while wendyos-data.sh erases and retries.
#
# A drop-in is the only mechanism that reaches every board. Drop-ins take
# precedence over unit files wherever those live (systemd.unit(5)), so this
# applies both to the data.mount that wendyos-data-setup ships on Tegra and
# Qualcomm, and to the one systemd-fstab-generator writes on x86, RPi and VM,
# which no recipe can edit.
#
# The timing is declared, not raced: wendyos-data.service is Before=data.mount,
# so the marker is written before this condition is evaluated. A unit skipped
# by a condition counts as started for dependency purposes, so nothing
# downstream cascades.
ConditionPathExists=!/config/data.enroll.pending
