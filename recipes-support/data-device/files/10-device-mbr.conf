[Unit]
# Wait for the /data device before the resolver looks at it -- the MBR half of
# the companion 10-device.conf, which ships everywhere except here.
#
# raspberrypi3-64 is the one board with an MBR table
# (conf/machine/raspberrypi3-64-wendyos.conf:14 -> rpi-wendy-ab-mbr.wks:44,
# `--ptable msdos`), and MBR carries no partition names, so the GPT device name
# that drop-in waits for can never appear here. That is not merely a wait that
# does nothing: it leaves the unit with NO device wait at all, and the udev
# coldplug race the wait exists to close comes straight back. That race is what
# skipped the first-boot format in the program this one replaced, which failed
# data.mount and collapsed the whole dependency chain hanging off it --
# WDY-1888, the device advertising mDNS placeholder names.
#
# The alias is safe to wait on here for the one reason it is unsafe on GPT: on
# an encrypted board /dev/wendyos/data is the unlocked mapper, which is what
# this very service produces, so the wait would be circular -- but
# raspberrypi3-64 can never encrypt (C21). Its alias is created by udev from
# the ext4 LABEL (99-wendyos-data-mbr.rules) and is always the raw partition,
# never a product of this service.
#
# After= with no Wants= is deliberate. This unit is WantedBy=data.mount, and a
# block-backed mount implicitly gains Requires= and After= on its device unit
# (systemd src/core/mount.c mount_add_device_dependencies() ->
# unit_add_node_dependency(), which adds UNIT_AFTER plus UNIT_REQUIRES), so
# dev-wendyos-data.device is already in the transaction whenever this runs and
# the ordering always applies. A Wants= would add nothing and would arm a
# DefaultDeviceTimeoutSec stall on a board with no /data device at all.
After=dev-wendyos-data.device
