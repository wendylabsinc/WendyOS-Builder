# Start early (before local-fs), not after basic.target: the /data unlock
# (wendyos-data.service, pulled in by data.mount) needs /dev/tpmrm0, which
# only appears after tee-supplicant + tee-ftpm-modprobe have run. With the
# stock ordering that is a deadlock: data.mount is part of local-fs.target
# while these services wait for basic.target, which waits for local-fs.
# Needs only udev (for /dev/teepriv0, created by the built-in OP-TEE driver)
# and a writable rootfs (/var/lib/tee).
#
# Before=wendyos-data.service makes /data, and so every unit after it, wait
# until the fTPM driver load is over. The load does the fTPM's first-time
# setup inside modprobe. The /config conversion runs after /data and stops
# tee-supplicant. Stopping it during the load makes systemd stop the loader,
# which is BindsTo= the supplicant, and SIGTERM modprobe. The kernel's wait
# for the supplicant is killable, so the fTPM's storage request is aborted.
# On an Orin Nano (2026-10-13) that crashed the fTPM. It also keeps the
# UEFI-variable traffic after /data (boot verification, rootfs redundancy, the
# boot random seed) out of the fTPM's first setup. That traffic triggers
# OP-TEE's lost wake-up on its single-instance lock, which
# 0001-core-poll-single-instance-lock-wait.patch recovers from.
#
# Ordering only. It is not the old 90-second wait on the TPM device node, and
# it costs about 1 s, about 5 s on the fTPM's first setup. No timeout, on
# purpose: a timeout would SIGTERM modprobe, the very thing to avoid.
#
# It lives here and not in wendyos-data.service because this drop-in is
# installed only with WENDYOS_ENABLE_TPM = "1", exactly where the loader
# starts before local-fs. Thor built with the TPM off still gets the loader
# from meta-tegra, but it starts after basic.target, so an After= in
# wendyos-data.service would be an ordering cycle there. This file is also
# installed for tee-supplicant, so the supplicant is ordered before
# wendyos-data.service too. That is harmless: it is Type=exec and counts as
# started at once.
[Unit]
DefaultDependencies=no
After=systemd-udevd.service systemd-remount-fs.service
Before=wendyos-data.service
Conflicts=shutdown.target
Before=shutdown.target

