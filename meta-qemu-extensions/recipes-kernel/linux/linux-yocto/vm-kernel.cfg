# ACPI, required to boot this image through UEFI.
#
# The upstream qemuarm64 BSP is DTB-only, which suits QEMU's -kernel path: QEMU
# generates a device tree and passes it directly. The .wic instead boots through
# firmware, which describes the platform with ACPI. Without CONFIG_ACPI the
# kernel finds no GIC, no PL011 and no virtio-blk, and dies before it can say so.
#
# SPCR is the table naming the console UART. Without it the kernel boots but
# stays silent, which is indistinguishable from not booting.
#
# Everything else the VM needs is already builtin in the BSP.
CONFIG_ACPI=y
CONFIG_ACPI_SPCR_TABLE=y
