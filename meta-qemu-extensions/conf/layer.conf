BBPATH:prepend := "${LAYERDIR}:"

BBFILES += " \
    ${LAYERDIR}/recipes-*/*/*.bb \
    ${LAYERDIR}/recipes-*/*/*.bbappend \
    "

BBFILE_COLLECTIONS += "wendyos-qemu"
BBFILE_PATTERN_wendyos-qemu := "^${LAYERDIR}/"
BBFILE_PRIORITY_wendyos-qemu = "51"

# qemu-arm64 builds on blacksail; wrynose stays in the set as the fallback
# series, matching the other wendyos layers.
LAYERSERIES_COMPAT_wendyos-qemu = "wrynose blacksail"
LAYERVERSION_wendyos-qemu = "1"
LAYERDEPENDS_wendyos-qemu = "core wendyos"
