# WendyOS ARM64 VM boot config, copied to EFI/BOOT/grub.cfg on the ESP by wic's
# bootimg_efi plugin.
#
# Simpler than the x86 grubAB.cfg by design. With WENDYOS_OTA="none" there is no
# trial-boot state to track, and nothing raw-writes the rootfs partition, so the
# ext4 label is a durable identity and `search --label` suffices. There is also
# no reboot-on-failure guard: the console is the user's own terminal, so a failed
# boot is visible and the menu usable. Both keep this board free of a grub-efi
# bbappend, since `search` is already in oe-core's default GRUB_BUILDIN.
#
# No `serial --unit=0`: on aarch64 GRUB's serial module cannot drive the PL011,
# and asking for a port it cannot open loses the console entirely. Firmware
# already routes the UEFI console to the virtual serial port.
terminal_input console
terminal_output console
set timeout=3

set default=0
menuentry "WendyOS" {
    search --label rootfsA --set=root
    linux /boot/Image root=PARTLABEL=rootfsA rw rootwait console=ttyAMA0,115200
}
