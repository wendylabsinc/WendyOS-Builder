name: NetworkManager stored-PSK regression

on:
  pull_request:
    paths:
      - 'recipes-connectivity/networkmanager/**'
      - 'tests/nm-transient-psk/**'
      - '.github/workflows/nm-transient-psk.yml'
  push:
    branches: [main]
    paths:
      - 'recipes-connectivity/networkmanager/**'
      - 'tests/nm-transient-psk/**'
      - '.github/workflows/nm-transient-psk.yml'

permissions:
  contents: read

jobs:
  handlers:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Install harness dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc libglib2.0-dev pkg-config patch
      - name: Test exact pinned NetworkManager policy
        run: python3 tests/nm-transient-psk/run.py --fetch-upstream --output "$RUNNER_TEMP/nm-transient-psk"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nm-transient-psk-results
          path: ${{ runner.temp }}/nm-transient-psk
