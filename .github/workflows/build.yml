name: Build Thor gs_usb module
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  module:
    runs-on: [self-hosted, linux, x64, wendyos-builder]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Inspect cached kernel build inputs
        shell: bash
        run: |
          set -euo pipefail
          base=/opt/wendy-cache/wendyos-builder
          ls -ld "$base"/*
          find "$base/sstate-cache" -maxdepth 3 -type f -name '*linux-noble-nvidia-tegra*' | head -n 60 || true
          find "$base/repos" -maxdepth 4 -type f -name 'linux-noble-nvidia-tegra.inc' -print 2>/dev/null || true
          find "$base/downloads" -maxdepth 2 -iname '*linux-noble*' -print 2>/dev/null || true
          df -h .
