name: Scripts CI

# Gate the device-artifact map + resolver so build.yml never picks up a broken
# resolver or a map that drifted out of sync with the build matrix.
on:
  pull_request:
    paths:
      - 'scripts/resolve-artifacts*'
      - 'scripts/make-t234-flashpack.sh'
      - 'scripts/t234_flashpack_manifest*'
      - 'scripts/make-jetson-disk-img.py'
      - 'scripts/make_jetson_disk_img_test.py'
      - 'recipes-core/wendyos-agent/files/*.sh'
      - 'scripts/build-driver.sh'
      - 'scripts/pack-sysext.sh'
      - 'recipes-core/wendyos-sysext-apply/files/*.sh'
      - 'recipes-kernel/wendyos-kernel-devkit/files/*.sh'
      - 'recipes-core/wendyos-identity/files/*.sh'
      - 'recipes-connectivity/avahi/files/*.sh'
      - '.github/device-artifacts.json'
      - '.github/workflows/scripts-ci.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/resolve-artifacts*'
      - 'scripts/make-t234-flashpack.sh'
      - 'scripts/t234_flashpack_manifest*'
      - 'scripts/make-jetson-disk-img.py'
      - 'scripts/make_jetson_disk_img_test.py'
      - 'recipes-core/wendyos-agent/files/*.sh'
      - 'scripts/build-driver.sh'
      - 'scripts/pack-sysext.sh'
      - 'recipes-core/wendyos-sysext-apply/files/*.sh'
      - 'recipes-kernel/wendyos-kernel-devkit/files/*.sh'
      - 'recipes-core/wendyos-identity/files/*.sh'
      - 'recipes-connectivity/avahi/files/*.sh'
      - '.github/device-artifacts.json'
      - '.github/workflows/scripts-ci.yml'

jobs:
  test:
    name: Resolver map + unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate device-artifacts.json
        run: jq empty .github/device-artifacts.json

      - name: shellcheck
        run: |
          shellcheck scripts/resolve-artifacts.sh scripts/resolve-artifacts.test.sh scripts/make-t234-flashpack.sh
          shellcheck recipes-core/wendyos-agent/files/wendyos-agent-updater.sh \
                     recipes-core/wendyos-agent/files/wendyos-agent-updater.test.sh \
                     recipes-core/wendyos-agent/files/download-wendyos-agent.sh
          # These run on the device or outside the build system, where a typo surfaces as
          # a failed boot or an unusable devkit rather than a build error.
          shellcheck scripts/build-driver.sh scripts/pack-sysext.sh \
                     recipes-core/wendyos-sysext-apply/files/wendyos-sysext-apply.sh \
                     recipes-kernel/wendyos-kernel-devkit/files/setup.sh
          shellcheck recipes-core/wendyos-identity/files/wendyos-identity-lib.sh \
                     recipes-core/wendyos-identity/files/update-mdns-uuid.sh \
                     recipes-core/wendyos-identity/files/update-mdns-uuid.test.sh \
                     recipes-connectivity/avahi/files/generate-hostname.sh

      - name: Run resolver tests
        run: bash scripts/resolve-artifacts.test.sh

      # The agent updater ships in the image and decides which agent every
      # device runs; a comparison bug there silently moves the whole fleet
      # (WDY-2038). Run under both shells a device might have: coreutils is in
      # packagegroup-wendyos-base, busybox is the Yocto fallback.
      - name: Run agent updater tests (GNU coreutils)
        run: bash recipes-core/wendyos-agent/files/wendyos-agent-updater.test.sh

      - name: Run agent updater tests (busybox)
        run: |
          docker run --rm -v "$PWD:/w" -w /w alpine:3 sh -c \
            'apk add -q bash && bash recipes-core/wendyos-agent/files/wendyos-agent-updater.test.sh'

      # The mDNS publisher decides what 'wendy device list' shows for every
      # device; a precedence bug there silently reverts an operator's rename on
      # the next reboot with nothing in the logs.
      - name: Run mDNS identity publisher tests
        run: bash recipes-core/wendyos-identity/files/update-mdns-uuid.test.sh


      - name: Run T234 flashpack manifest tests
        run: python3 -m unittest scripts/t234_flashpack_manifest_test.py

      - name: Run Jetson raw disk image tests
        run: python3 -m unittest scripts/make_jetson_disk_img_test.py
