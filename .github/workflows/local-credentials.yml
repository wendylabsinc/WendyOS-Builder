name: Local credential policy
on:
  pull_request:
    paths:
      - 'recipes-extended/wendyos-user/**'
      - 'recipes-extended/pam/**'
      - 'recipes-extended/libpwquality/**'
      - 'recipes-extended/shadow/**'
      - 'tests/local-credentials/**'
      - '.github/workflows/local-credentials.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pam-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build disposable Linux PAM test image
        run: docker build -f tests/local-credentials/Dockerfile -t wendy-local-credentials-test .
      - name: Test locked default and password provisioning
        run: docker run --rm --network none wendy-local-credentials-test
