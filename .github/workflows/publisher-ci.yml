name: Publisher CI

# The publisher (tools/publisher) previously lived in its own repo with no CI.
# Gate every change to it with vet + tests so workflow runs never pick up a
# broken publisher.
on:
  pull_request:
    paths:
      - 'tools/publisher/**'
      - '.github/workflows/build.yml'
      - '.github/workflows/drivers.yml'
      - '.github/workflows/publisher-ci.yml'
  push:
    branches: [main]
    paths:
      - 'tools/publisher/**'
      - '.github/workflows/build.yml'
      - '.github/workflows/drivers.yml'
      - '.github/workflows/publisher-ci.yml'

jobs:
  test:
    permissions:
      contents: read
    name: Vet and test publisher
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/publisher
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: tools/publisher/go.mod
          cache-dependency-path: tools/publisher/go.sum

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./...

      - name: Publishing workflow tests
        run: python3 workflow_batch_test.py
