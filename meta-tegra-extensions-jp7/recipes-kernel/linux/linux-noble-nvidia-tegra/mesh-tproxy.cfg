# UDP mesh VIP interception keeps the original destination with TPROXY.
# IP_NF_MANGLE and NETFILTER_XTABLES are modules in the JP7 6.8 kernel, so
# these must be modules too. xt_TPROXY selects the defragmentation dependency.
# packagegroup-wendyos-tegra installs xt_TPROXY and its module dependencies;
# enabling them here alone does not put them in the image.
CONFIG_NETFILTER_XT_TARGET_TPROXY=m
CONFIG_NF_TPROXY_IPV4=m
