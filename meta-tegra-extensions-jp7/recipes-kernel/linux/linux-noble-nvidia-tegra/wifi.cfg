# Wi-Fi for M.2 E-key cards on JetPack 7 (kernel 6.8.12-l4t-r39.2.0).
#
# NVIDIA's defconfig opens the vendor menus (CONFIG_WLAN_VENDOR_INTEL=y,
# CONFIG_WLAN_VENDOR_REALTEK=y) but enables none of the drivers behind them,
# so an Intel AX210 (8086:2725) enumerates on PCI with no driver bound and
# `wendy device wifi list` reports no Wi-Fi device. Verified on an Orin Nano
# (Holybro Pixhawk Jetson Baseboard) running WendyOS 0.19.3, 2026-09-21.
#
# KCONFIG_MODE = "--alldefconfig" (linux-noble-nvidia-tegra.inc) honours the
# symbols named in a fragment but does not switch on unmentioned parents, so
# the chain is spelled out down to CONFIG_WLAN. cfg80211/mac80211 are already
# =m in the defconfig; repeating them here only pins them.
#
# Modules (=m), unlike usb-serial.cfg's =y: module auto-loading was re-checked
# on the 0.19.3 image and works (btusb, btintel, cfg80211 and r8168 all
# arrive through udev's modalias path), and iwlwifi has to be a module
# anyway -- built in, it probes before the rootfs is mounted and its firmware
# request fails. The module packages are hard IMAGE_INSTALL entries in
# conf/distro/include/tegra-image.inc, and the bbappend checks the resolved
# .config, so a symbol Kconfig drops fails the build instead of silently
# shipping a board without Wi-Fi.

CONFIG_WLAN=y
CONFIG_CFG80211=m
CONFIG_MAC80211=m

# Intel discrete cards: AX200 (cc), AX210/AX1675 (ty), 9260, 8265. IWLMVM is
# the opmode for all of them. IWLMLD (Wi-Fi 7 BE200/BE202) only exists from
# 6.15, and IWLDVM only covers pre-2013 mini-PCIe parts.
CONFIG_WLAN_VENDOR_INTEL=y
CONFIG_IWLWIFI=m
CONFIG_IWLMVM=m

# Realtek rtw88 PCIe cards. RTW88_8822CE is deliberately left out: the
# devkit's on-board RTL8822CE is already driven by NVIDIA's out-of-tree
# rtl8822ce.ko (nvidia-kernel-oot, shipped under /lib/modules/*/updates with
# the same pci:v000010ECd0000C822 alias), and two drivers claiming one device
# would race at every boot. Add it only if that vendor module goes away.
CONFIG_WLAN_VENDOR_REALTEK=y
CONFIG_RTW88=m
CONFIG_RTW88_PCI=m
CONFIG_RTW88_8822BE=m
CONFIG_RTW88_8821CE=m
CONFIG_RTW88_8723DE=m

# The Bluetooth half of these cards is a USB function (AX210: 8087:0032),
# driven by btusb plus the vendor helper. All already =m in the defconfig;
# pinned because the firmware packages in tegra-image.inc assume them.
CONFIG_BT_HCIBTUSB=m
CONFIG_BT_INTEL=m
CONFIG_BT_RTL=m
CONFIG_BT_MTK=m
