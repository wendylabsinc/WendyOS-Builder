# devices=0 means the module loads with ONLY the control device
# (/dev/v4l2loopback) and creates no stray /dev/video0 node — the WendyAgent
# device agent adds pinned-number capture nodes itself via
# V4L2LOOPBACK_CTL_ADD, and a phantom device 0 would collide with real
# camera enumeration.
# exclusive_caps=1 makes each created device announce OUTPUT xor CAPTURE
# capabilities (not both), which is what most consumers (e.g. gstreamer,
# ffmpeg) expect from a loopback device.
options v4l2loopback devices=0 exclusive_caps=1
