[main]
# Feed independent interface DNS to resolved. The mesh agent adds its selected
# donor on the owned TUN with ~. routing while roaming, then reverts that link.
dns=systemd-resolved

# Preserve the image's managed resolver symlink. Following it with rc-manager
# file would overwrite resolved's generated file during a physical DNS change.
rc-manager=symlink

# Enable plugins
plugins=keyfile

# Don't manage lo (loopback)
no-auto-default=lo

# Per-interface internet check. A device whose check is not FULL gets +20000 on
# its default-route metric, so an ethernet link with no internet (metric 100,
# 99-interface-metrics.conf) falls behind a working Wi-Fi (300) until it passes
# again. Needs concheck compiled in (networkmanager_%.bbappend).
[connectivity]
enabled=true
uri=http://connectivitycheck.gstatic.com/generate_204
# Empty: expect HTTP 204 / no body. Unset, NM expects "NetworkManager is online"
# and reports this endpoint as a captive portal.
response=
# While a link is FULL, NM checks it once per interval, so this bounds how long
# a dead uplink keeps the default route (plus the 20 s timeout). After a failed
# check NM re-probes at 1 s and doubles up to this value, so recovery is also
# noticed within one interval. The NM default of 300 s is too slow for failover.
interval=60

[logging]
# Log level: ERR, WARN, INFO, DEBUG
level=INFO

# Log to systemd journal
backend=journal

[device]
# Automatically manage all devices by default
# Specific interfaces can be excluded in connection profiles
wifi.scan-rand-mac-address=no

[connection]
# Set default connection timeout
connection.auth-retries=0
