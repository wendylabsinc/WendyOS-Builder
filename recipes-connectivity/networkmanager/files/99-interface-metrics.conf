# NetworkManager interface priority configuration
# Lower metric = higher priority
#
# Priority order (highest to lowest):
# 1. Ethernet (eth0/enp*) - Wired network, metric 100
# 2. WiFi (wlan0) - Wireless, metric 300
# 3. USB network links - Fallback, metric 700
#
# NetworkManager takes each value from the first section that matches the
# device, and every USB link below is also an "ethernet" device to it. The USB
# section therefore has to come before the Ethernet one.
#
# A USB link is a fallback because of what is usually behind it:
# - usb0, the USB gadget link to a developer's computer. It must not replace
#   Ethernet or WiFi as the default route. (Its own profile also sets 700.)
# - a phone sharing its connection, or a cellular modem or LTE stick in its
#   ethernet mode (RNDIS, CDC-ECM, iPhone). At the Ethernet metric it carried
#   all traffic, image pulls included, over a data plan while WiFi was up.
# The kernel names links it knows to be point-to-point usb* and cellular ones
# wwan*; the drivers catch modems and phones that show an ordinary Ethernet
# address and are named eth*. A real USB Ethernet adapter that uses one of these
# drivers ranks behind WiFi too; adapters on r8152, ax88179_178a, asix, lan78xx,
# smsc95xx and cdc_ncm keep the Ethernet metric.

[connection-usb]
match-device=interface-name:usb*,interface-name:wwan*,driver:rndis_host,driver:cdc_ether,driver:ipheth
ipv4.route-metric=700
ipv6.route-metric=700

[connection-ethernet]
match-device=type:ethernet
ipv4.route-metric=100
ipv6.route-metric=100

[connection-wifi]
match-device=type:wifi
ipv4.route-metric=300
ipv6.route-metric=300
