# The Wendy agent owns the mesh host address, point-to-point Babel TUNs and
# Wi-Fi Aware data-path interface. NetworkManager must not activate a profile,
# assign an address or replace a route on these links.
[keyfile]
unmanaged-devices=interface-name:=wlmesh0;interface-name:wlmp*;interface-name:=wnanndi0
