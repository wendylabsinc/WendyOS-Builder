# Clamp ethernet link MTU for carrier uplinks (WDY-2443)
#
# LTE/CGNAT uplinks (a carrier modem plugged into eth0 is ethernet-class to
# NetworkManager) have path MTUs around 1430 and drop ICMP frag-needed, so
# full-size frames are silently black-holed: TLS handshakes to Wendy Cloud
# never complete and the agent loops on "authentication handshake failed:
# EOF" while the device otherwise looks healthy.
#
# Clamping the link MTU to 1400:
# - outbound: no frame exceeds the carrier path MTU
# - inbound: our SYN advertises MSS 1360, so servers never send oversized
#   segments either
# - containers: CNI bridge traffic is NATed out this link; with the link MTU
#   lowered, the kernel emits frag-needed locally into the container netns,
#   so container PMTUD works without carrier ICMP
#
# net.ipv4.tcp_mtu_probing (see /etc/sysctl.d/99-wendyos-pmtu.conf) covers
# host TCP adaptively; this clamp covers UDP/QUIC, containers, and the
# inbound direction. Both are needed.
#
# This is a connection DEFAULT: it only applies while a profile leaves
# ethernet.mtu at "auto". Sites with throughput-critical wired LANs can
# override per connection (persists on /data, survives reboots and OTA):
#   nmcli connection modify <name> 802-3-ethernet.mtu 1500
#
# Worst-case LAN throughput cost of 1400 vs 1500 is ~7% for full-size
# streams. WiFi is deliberately not clamped (not the failing path).

[connection-ethernet-mtu]
match-device=type:ethernet
ethernet.mtu=1400
