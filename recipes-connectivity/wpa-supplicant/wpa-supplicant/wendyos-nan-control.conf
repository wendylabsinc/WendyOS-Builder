[Service]
# NAN management interfaces are created through wpa_supplicant's global
# control socket. NetworkManager continues to use this same daemon over D-Bus
# for ordinary station interfaces.
RuntimeDirectory=wpa_supplicant
RuntimeDirectoryMode=0750
ExecStart=
ExecStart=/usr/sbin/wpa_supplicant -u -g /run/wpa_supplicant/global
