# Refuse the legacy TIOCSTI ioctl for unprivileged callers.
#
# TIOCSTI pushes a byte into a tty's input queue as if the user had typed it.
# A process holding an fd to a terminal that is later used by a more privileged
# shell can type commands into that shell -- the classic escalation is a
# process left running as an ordinary user injecting into a root shell opened
# with su(1) in the same terminal. It is also a standard way out of restricted
# shells and sandboxes that leak a tty fd.
#
# The kernel gate (drivers/tty/tty_io.c, tiocsti()) is deny-only:
#     if (!tty_legacy_tiocsti && !capable(CAP_SYS_ADMIN))
#             return -EIO;
# so 0 denies the ioctl to unprivileged callers and leaves it available to
# CAP_SYS_ADMIN. Nothing gains privilege from this setting.
#
# It is also required, not merely advisable. shadow 4.20.0 -- which arrived with
# the 2026-08-04 blacksail oe-core bump -- refuses to give su(1) a controlling
# terminal while this ioctl is available, so escalated shells came up unable to
# tcsetpgrp():
#     cannot set terminal process group (-1): Inappropriate ioctl for device
#     no job control in this shell
# Upstream records that as a permanent regression ("users must adapt"), so
# disabling the ioctl is the configuration shadow now expects.
#
# The Tegra kernel builds CONFIG_LEGACY_TIOCSTI=y, which defaults the sysctl to
# 1. A kernel fragment setting it to n would drop the ioctl entirely -- strictly
# stronger, but per-BSP and needs a kernel rebuild.
dev.tty.legacy_tiocsti = 0
