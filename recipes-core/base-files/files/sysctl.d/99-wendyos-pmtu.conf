# Recover TCP from Path-MTU black holes (WDY-2443)
#
# Carrier LTE/CGNAT uplinks commonly have a path MTU below 1500 AND drop the
# ICMP "fragmentation needed" replies that classic PMTU discovery depends on.
# Small packets pass, every full-size packet is silently black-holed: TCP
# connects, then the first large packet (e.g. the ~1556-byte post-quantum TLS
# ClientHello) is never delivered and the handshake hangs. The device looks
# healthy but never reaches Wendy Cloud.
#
# RFC 4821 packetization-layer PMTU discovery is the mechanism designed for
# exactly this case: it infers the path MTU from the retransmission pattern and
# needs no ICMP. Linux ships it disabled, which is the gap these three lines
# close. Verified on an affected device (Enmax1, TELUS LTE, path MTU ~1430):
# HTTPS at link MTU 1500 recovers in ~4s.
#
# COVERAGE. These sysctls are per-network-namespace and TCP-only, so they
# protect host-originated TCP and nothing else. Containers (their own netns
# keeps the kernel default), UDP/QUIC, and the inbound direction -- where the
# MSS we advertise comes from the link MTU, not from anything we discover --
# are all still exposed.
#
# Those gaps are closed at the LTE modem, not here: the MikroTik KNOT units run
# RouterOS, so an MSS clamp in the firewall mangle plus DHCP option 26 fixes
# every client behind them, in both directions, including container traffic that
# no host-side setting can reach. What ships in the image is the safety net for
# links we do not own -- a customer's own router, a phone hotspot, a site that
# adds cellular failover after we ship.

# Arm the black-hole fallback. 1 means "only once a black hole is detected",
# which is after ~3s of unsuccessful retransmission: the gate is elapsed time,
# not a retransmit count -- retransmits_timed_out() compares against
# tcp_model_timeout(sk, tcp_retries1, TCP_RTO_MIN) = ((2<<3)-1) * 200ms.
#
# The cost on a healthy device is false positives. Ordinary loss -- bad WiFi
# during a roam, a congested cellular moment -- looks identical to a black hole
# for that ~3s, and the connection then gets clamped as below.
net.ipv4.tcp_mtu_probing = 1

# The FIRST fallback step, not a floor: on detection the socket is clamped to
# this, and 1200 still fits any path down to the 1280-byte minimum that IPv6
# guarantees, so one step recovers essentially every real constriction. (Same
# reasoning behind QUIC's 1200-byte initial datagram.)
net.ipv4.tcp_base_mss = 1200

# The actual floor, and the knob that bounds a false positive. Each further
# unsuccessful retransmission HALVES the search: 1200, 600, 300, ... down to
# this value, whose default is TCP_MIN_SND_MSS = 48. On a genuine MTU problem
# the halving stops as soon as a segment gets through; on a false positive
# nothing ever fits, so it does not stop. Recovery upward is not on a timer
# either -- probing needs cwnd >= 11 plus queued data, so a bulk transfer
# climbs back within a few RTTs while an idle control connection may never
# qualify and can stay tiny until it closes.
#
# 512 keeps a false positive at a slow-but-usable segment size, and 552-byte
# packets still clear the classic 576-byte IPv4 floor, so genuinely narrow
# paths remain discoverable. Do not raise this to 1200: that would make any
# path under 1240 undiscoverable, which is the very case this mechanism exists
# to rescue.
net.ipv4.tcp_mtu_probe_floor = 512
