# Recover TCP from Path-MTU black holes (WDY-2443)
#
# Carrier LTE/CGNAT uplinks commonly have a path MTU below 1500 AND drop the
# ICMP "fragmentation needed" replies that classic PMTU discovery depends on.
# Small packets pass, every full-size packet is silently black-holed: TCP
# connects, then the first large packet (e.g. the ~1556-byte post-quantum TLS
# ClientHello) is never delivered and the handshake hangs. The device looks
# healthy but never reaches Wendy Cloud.
#
# RFC 4821 packetization-layer PMTU discovery infers the path MTU from the
# retransmission pattern and needs no ICMP. Mode 1 is inert on a healthy
# connection: it engages only after a black hole is detected (~3s of
# consecutive retransmission timeouts). Verified on an affected device
# (TELUS LTE, path MTU ~1430): HTTPS at link MTU 1500 recovers in ~4s.
#
# TCP-only and per-network-namespace. Carrier-specific tuning (MTU/MSS
# clamps) deliberately does NOT ship in the image; that belongs on the LTE
# modem (RouterOS: MSS clamp in firewall mangle + DHCP option 26).
net.ipv4.tcp_mtu_probing = 1
