# Recover TCP from Path-MTU black holes (WDY-2443)
#
# Carrier LTE/CGNAT uplinks commonly have a path MTU below 1500 AND drop the
# ICMP "fragmentation needed" replies that classic PMTU discovery depends on.
# Small packets pass, every full-size packet is silently black-holed: TCP
# connects, then the first large packet (e.g. the ~1556-byte post-quantum TLS
# ClientHello) is never delivered and the handshake hangs. The device looks
# healthy but never reaches Wendy Cloud.
#
# tcp_mtu_probing=1 enables RFC 4821 packetization-layer PMTU discovery when
# a black hole is detected, so TCP adapts to whatever the carrier's real path
# MTU is without ICMP feedback. Verified on an affected device (Enmax1,
# TELUS LTE, path MTU ~1430): HTTPS at link MTU 1500 recovers in ~4s.
#
# NOTE: this sysctl is per-network-namespace, so it protects host-originated
# TCP only. Container traffic is protected by the ethernet.mtu clamp in
# /etc/NetworkManager/conf.d/99-mtu-clamp.conf, which also covers UDP/QUIC
# and lowers the MSS we advertise to servers (inbound direction).
net.ipv4.tcp_mtu_probing = 1

# Floor MSS used once probing engages after a detected black hole (kernel
# default 1024). 1200 converges faster and still sits well below the worst
# observed carrier path MTU (~1430) minus TCP/IP headers.
net.ipv4.tcp_base_mss = 1200
