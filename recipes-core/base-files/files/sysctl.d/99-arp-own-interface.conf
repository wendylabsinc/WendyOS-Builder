# Answer ARP only on the interface that owns the address. On a LAN a device
# reaches by both cable and Wi-Fi, Wi-Fi otherwise answers for the cable's
# address too, and a host that keeps the last reply, as macOS does, then sends
# cable traffic over Wi-Fi.
net.ipv4.conf.all.arp_ignore = 1
net.ipv4.conf.all.arp_announce = 2
