# Installed when the agent release ships wendy-agent-supervisor. It runs the
# image's agent or a checked update from /data, and falls back on its own.
[Unit]
# Ordering only: without /data the supervisor runs the image's agent.
After=data.mount
# The supervisor decides when to give up on an agent, not the start limit.
StartLimitIntervalSec=0

[Service]
ExecStart=
ExecStart=/opt/wendyos/bin/wendy-agent-supervisor
# Stop signals go to the supervisor, which stops the agent once and waits for it.
KillMode=mixed
# The agent logs through the supervisor's stream; keep its journal tag.
SyslogIdentifier=wendy-agent
