# Wendy's routed app-to-mesh UDP path uses IPv4 TPROXY after bridge routing.
# Calling the IPv4 hook early for bridged traffic prevents socket delivery.
# Missing keys are harmless when br_netfilter is absent; udev applies this
# again if that module is loaded later. IPv6/ARP bridge policy is unchanged.
net.bridge.bridge-nf-call-iptables = 0
