[Unit]
# Read the persisted timestamp only after the optional bind mount has settled.
# A failed persistence mount must not disable network time synchronization.
Wants=var-lib-systemd-timesync.mount
After=var-lib-systemd-timesync.mount systemd-remount-fs.service

[Service]
# Keep the remount-fs ordering above for the writable rootfs fallback.
# StateDirectory= implicitly adds RequiresMountsFor=, making the mount a hard
# dependency even with Wants= above. Prepare the same directory explicitly so
# timesyncd can use the rootfs copy when persistence fails. The '+' runs this
# preparation as root, outside the service's filesystem sandbox; the daemon
# still runs as systemd-timesync with its original sandbox and capabilities.
StateDirectory=
ExecStartPre=+/usr/bin/install -d -m 0755 -o systemd-timesync -g systemd-timesync /var/lib/systemd/timesync
ReadWritePaths=/var/lib/systemd/timesync
