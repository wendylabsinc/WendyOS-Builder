[Unit]
# If data.mount is started by a later job (manual start after a failed boot,
# or a future device->mount Wants=), bring the /data consumers with it so the
# device does not come up amnesiac with containerd on the root slot (WDY-3127).
# Units absent on a given board are ignored by Wants=.
Wants=var-lib-containerd.mount var-lib-wendy.mount var-lib-bluetooth.mount var-lib-tee.mount var-log.mount home.mount wendyos-etc-binds.service swapfile-setup.service
