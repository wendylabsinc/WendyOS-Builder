[Unit]
# The data partition's device unit gets systemd's DefaultDeviceTimeoutSec
# (90 s) by default. After an unclean power cut the NVMe/udev link for the
# partition can appear later than that; when it did, data.mount failed and
# every /data consumer (identity, enrolment, containerd bind) was skipped,
# leaving containerd on the OS root slot (WDY-3127). This is what
# systemd-fstab-generator emits for x-systemd.device-timeout=, which only
# works in /etc/fstab, not in .mount unit files.
JobRunningTimeoutSec=5min
