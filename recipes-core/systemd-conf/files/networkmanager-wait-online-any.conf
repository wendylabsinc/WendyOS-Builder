# WendyOS: network-online.target provider policy (NetworkManager mode).
#
# nm-online -s waits until NetworkManager has tried every startup connection,
# so one link that never gets an address (an Ethernet port without DHCP) holds
# network-online.target until the timeout even though another link is up.
# Wait for any connection instead, like networkd mode's --any.
[Service]
ExecStart=
ExecStart=/usr/bin/nm-online -q
