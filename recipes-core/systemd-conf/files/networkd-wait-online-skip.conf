# WendyOS: network-online.target provider policy (NetworkManager mode).
#
# NetworkManager-wait-online provides network-online.target. networkd's own
# wait-online stays enabled through systemd-networkd.service's [Install] Also=,
# which no preset can undo, and it waits out its timeout for links networkd
# never configures (an unused NIC, the Pi's dummy0). Skip it instead: a
# skipped unit neither fails nor holds network-online.target.
[Unit]
ConditionPathExists=!/usr/sbin/NetworkManager
