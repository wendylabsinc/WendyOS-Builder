[Journal]
# Store journals on persistent storage (/var/log/journal)
Storage=persistent

# Limit persistent journal to 512MB maximum
SystemMaxUse=512M

# Keep at least 1GB free on the filesystem
SystemKeepFree=1G

# Limit runtime (volatile) journal to 64MB
RuntimeMaxUse=64M

# NO age-based retention, deliberately. MaxRetentionSec=1month used to be here
# and it DELETED the early-boot journal on every board without a working RTC.
# Such a board starts at 1970, so journald stamps early boot 1970, the flush
# moves those entries to /var/log/journal, timesyncd then jumps the clock to
# the real date, journald rotates on the change and applies retention -- and
# the rotated file is suddenly 56 years old, so it is vacuumed. Measured on
# jetson-agx-thor 2026-09-28: every boot lost its first ~15 seconds, which is
# exactly the /data, resolver and early-ordering window. The entries were
# destroyed, not misfiled -- `journalctl -m` across every machine journal found
# nothing and no archive file survived.
#
# Size is the right bound for an appliance and SystemMaxUse/SystemKeepFree
# above already provide it. Age adds nothing and costs the logs we most need.
# Do not "restore" this with a larger value: a larger value still deletes a
# 1970-stamped file, it only changes which boards notice.

# Compress logs to save space
Compress=yes

# Forward to syslog for compatibility
ForwardToSyslog=yes
