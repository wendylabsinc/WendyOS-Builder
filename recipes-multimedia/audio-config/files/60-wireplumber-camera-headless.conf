# Fail loudly if the V4L2 monitor cannot load.
#
# The stock profile only "wants" it, so a broken V4L2 monitor would leave the
# device with no camera nodes and nothing in the log to say why. Cameras are a
# primary WendyOS feature, so treat a missing monitor as a startup failure.
#
# This file is SPA-JSON, not Lua: "--" comments or ["key"] indexing make
# WirePlumber reject it with "section 'wireplumber.profiles' has no value".
wireplumber.profiles = {
  main = {
    monitor.v4l2 = required
  }
}
