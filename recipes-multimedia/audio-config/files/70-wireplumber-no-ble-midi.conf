# Mesh CoC uses the BLE ACL independently of GATT. PipeWire's BLE-MIDI
# monitor probes encrypted MIDI characteristics on nearby mesh peers, which
# can trigger SMP pairing and disconnect an unpaired mesh link. Keep the
# regular BlueZ audio monitor and other GATT functionality enabled.
wireplumber.profiles = {
  main = {
    monitor.bluez-midi = disabled
  }
}
