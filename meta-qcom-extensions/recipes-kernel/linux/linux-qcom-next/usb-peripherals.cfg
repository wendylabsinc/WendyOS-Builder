# Host-side USB peripheral drivers. WENDYOS_QCOM_USB_PERIPHERAL_MODULES is the
# list this has to satisfy; modular, so each driver emits the package it names.

# CDC-ACM serial devices, /dev/ttyACM*.
CONFIG_USB_ACM=m

# USB-serial bridges, /dev/ttyUSB*.
CONFIG_USB_SERIAL=m
CONFIG_USB_SERIAL_CP210X=m
CONFIG_USB_SERIAL_FTDI_SIO=m
# The BSP defconfig leaves these two off.
CONFIG_USB_SERIAL_CH341=m
CONFIG_USB_SERIAL_PL2303=m

# Realtek USB Ethernet adapters.
CONFIG_USB_NET_DRIVERS=y
CONFIG_USB_RTL8152=m

# USB audio class devices.
CONFIG_SND_USB=y
CONFIG_SND_USB_AUDIO=m

# USB cameras. sensor-loopback.cfg requests the media stack this depends on.
CONFIG_USB_VIDEO_CLASS=m
