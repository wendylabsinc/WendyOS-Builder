# Virtual local devices for SensorLink sources. Keep the BSP's modular sound
# stack and let SND_ALOOP select its PCM/timer dependencies.
CONFIG_SOUND=m
CONFIG_SND=m
CONFIG_SND_DRIVERS=y
CONFIG_SND_ALOOP=m
CONFIG_MEDIA_SUPPORT=m
CONFIG_MEDIA_CAMERA_SUPPORT=y
# Preserve the BSP's UVC driver, which selects the hidden videobuf2 options.
# VIDEO_DEV defaults on for camera support; the post-configure gate checks it.
CONFIG_MEDIA_USB_SUPPORT=y
CONFIG_USB_VIDEO_CLASS=m
