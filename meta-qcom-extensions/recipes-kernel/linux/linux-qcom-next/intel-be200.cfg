# BE200 and BE202 use the native MLD opmode in the pinned qcom-next kernel.
# IWLMVM alone still exposes their PCI alias but cannot select their device info.
CONFIG_WLAN_VENDOR_INTEL=y
CONFIG_IWLWIFI=m
CONFIG_IWLMLD=m

# The M.2 card's Bluetooth function is USB, independent of its PCIe Wi-Fi.
CONFIG_BT_HCIBTUSB=m

# The exported native module bundle and external driver devkit use symbol CRCs.
CONFIG_MODVERSIONS=y
# Distinguish this ABI from earlier add-on images missing mesh identity support.
CONFIG_LOCALVERSION="-wendyos-addons-nan"
