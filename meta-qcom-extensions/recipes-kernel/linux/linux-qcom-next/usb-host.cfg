# Two pieces the micro-AB socket needs. It is connector-2 in
# monaco-evk-common.dtsi, wired to usb_2 -- usb@a400000 -- through a port graph.
#
# Reference regulator for usb_2_hsphy's PLL rail: the PHY's vdda-pll-supply is
# <&refgen>. Its DT node has always been there, but as a module nothing installs
# it, so the PHY defers forever on a supply with no driver and a400000.usb never
# probes. Built in so it cannot lose a race with udev.
CONFIG_REGULATOR_QCOM_REFGEN=y

# Driver for the connector-2 node. It reads the ID pin, drives usb_2's role
# switch, and -- the point of using it rather than pinning the port -- enables
# the usb2_vbus rail only while the port is in host role. Nothing turns it on by
# default: the one select in the tree is PHY_TEGRA_XUSB, and
# arch/arm64/configs/prune.config unsets ARCH_TEGRA. Without it connector-2 binds
# no driver and usb_2 sits in the peripheral role dwc3 starts a role switch in.
# Built in for the same reason as refgen: as a module nothing would install it.
CONFIG_USB_CONN_GPIO=y
