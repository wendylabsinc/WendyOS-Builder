# Babel selects device ULA routes in its own IPv6 policy-routing table.
CONFIG_IPV6=y
CONFIG_IPV6_MULTIPLE_TABLES=y
CONFIG_TUN=y

# Container VIP interception uses a separate IPv4 policy-routing table.
CONFIG_IP_ADVANCED_ROUTER=y
CONFIG_IP_MULTIPLE_TABLES=y

# UDP VIP interception must be available on every BSP, not only the Jetsons.
# Preserve the JP7 contract's module choice; module dependencies are checked
# against the image alongside the requested target.
CONFIG_NETFILTER_XT_TARGET_TPROXY=m
CONFIG_NF_TPROXY_IPV4=m
