# Native Linux game-controller support shared by every WendyOS kernel.
#
# The event and HID interfaces are built in so entitled applications always
# get evdev devices. Transport/vendor drivers remain modules where BSP
# dependencies are commonly modular; packagegroup-wendyos-kernel guarantees
# that any resulting module package is present in the image.

CONFIG_INPUT=y
CONFIG_INPUT_EVDEV=y
CONFIG_INPUT_JOYDEV=y
CONFIG_INPUT_JOYSTICK=y

CONFIG_HID=y
CONFIG_HID_GENERIC=y
CONFIG_USB_HID=y
CONFIG_UHID=y

CONFIG_BT_HIDP=m
CONFIG_JOYSTICK_XPAD=m
CONFIG_HID_MICROSOFT=m
