# Core and protocols
CONFIG_CAN=m
CONFIG_CAN_RAW=m
CONFIG_CAN_BCM=m
CONFIG_CAN_ISOTP=m
CONFIG_CAN_J1939=m

# Device driver core
CONFIG_CAN_DEV=m
CONFIG_CAN_NETLINK=y
CONFIG_CAN_CALC_BITTIMING=y

# Virtual and serial-line
CONFIG_CAN_VCAN=m
CONFIG_CAN_SLCAN=m

# USB adapters. Every driver in drivers/net/can/usb as of 6.8/6.12; 6.18 adds
# CAN_NCT6694, deliberately left out (needs MFD_NCT6694, and the symbol does not
# exist on the older kernels, so it would fail the config audit there).
CONFIG_CAN_8DEV_USB=m
CONFIG_CAN_EMS_USB=m
CONFIG_CAN_ESD_USB=m
CONFIG_CAN_ETAS_ES58X=m
CONFIG_CAN_F81604=m
CONFIG_CAN_GS_USB=m
CONFIG_CAN_KVASER_USB=m
CONFIG_CAN_MCBA_USB=m
CONFIG_CAN_PEAK_USB=m
CONFIG_CAN_UCAN=m

# SPI transceivers. The SPI core is pinned here for the same reason CAN_DEV and
# CAN_NETLINK are: the two drivers below sit inside a menu gated "depends on SPI"
# (drivers/net/can/spi/Kconfig), and CONFIG_SPI is a bool with no default that
# nothing in the genericx86-64 config chain sets. Without this line those two
# symbols are unreachable on x86 and do_kernel_configcheck warns on every kernel
# rebuild. No-op on Tegra and RPi, whose defconfigs already have SPI=y.
CONFIG_SPI=y
CONFIG_CAN_MCP251X=m
CONFIG_CAN_MCP251XFD=m
