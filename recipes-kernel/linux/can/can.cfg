# Core and protocols
CONFIG_CAN=m
CONFIG_CAN_RAW=m
CONFIG_CAN_BCM=m
CONFIG_CAN_ISOTP=m
CONFIG_CAN_J1939=m

# Pinned although Kconfig defaults it to y: the packagegroup installs
# kernel-module-can-gw and should not rely on a default.
CONFIG_CAN_GW=m

# Device driver core
CONFIG_CAN_DEV=m
CONFIG_CAN_NETLINK=y
CONFIG_CAN_CALC_BITTIMING=y

# Virtual and serial-line. slcan is what stock CANable firmware speaks; attach it
# with `ldattach 17 <tty>` (util-linux) or slcand, then use `ip link` as usual.
CONFIG_CAN_VCAN=m
CONFIG_CAN_SLCAN=m

# USB adapters: every driver in drivers/net/can/usb. CAN_NCT6694 (6.18 only,
# needs MFD_NCT6694) is left out because it does not exist on older kernels.
CONFIG_CAN_8DEV_USB=m
CONFIG_CAN_EMS_USB=m
CONFIG_CAN_ESD_USB=m
CONFIG_CAN_ETAS_ES58X=m
CONFIG_CAN_F81604=m
CONFIG_CAN_GS_USB=m
CONFIG_CAN_KVASER_USB=m
CONFIG_CAN_MCBA_USB=m
CONFIG_CAN_PEAK_USB=m
CONFIG_CAN_UCAN=m

# SPI transceivers. The two MCP251x drivers depend on SPI, which the x86 config
# does not enable, so SPI is pinned here.
CONFIG_SPI=y
CONFIG_CAN_MCP251X=m
CONFIG_CAN_MCP251XFD=m
