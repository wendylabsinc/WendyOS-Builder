# Native game-controller support, shared by every shipping WendyOS kernel. The contract
# this has to satisfy is conf/distro/include/game-controller.inc.

# Interfaces applications bind to, built in so nothing races a module load.
CONFIG_INPUT=y
CONFIG_INPUT_EVDEV=y
CONFIG_INPUT_JOYSTICK=y
CONFIG_HID=y
CONFIG_HID_GENERIC=y
CONFIG_HIDRAW=y
CONFIG_USB=y
CONFIG_USB_HID=y

# Loaded on demand: legacy /dev/input/js*, userspace HID, and the shared rumble backend.
CONFIG_INPUT_JOYDEV=m
CONFIG_UHID=m
CONFIG_INPUT_FF_MEMLESS=m

# HIDP's Kconfig parents are requested here too, so the contract never rests on what a
# BSP defconfig happens to leave enabled.
CONFIG_BT=m
CONFIG_BT_BREDR=y
CONFIG_BT_HIDP=m

# The PlayStation, Sony, Nintendo and Logitech drivers each "depends on" an LED class, and
# Kconfig discards a driver whose depends-on is unmet rather than pulling the parent in.
CONFIG_NEW_LEDS=y
CONFIG_LEDS_CLASS=y
CONFIG_LEDS_CLASS_MULTICOLOR=m

# hid-generic drives an unknown pad; only these expose the full axis, touchpad, LED and
# battery behaviour of the controllers people actually own.
CONFIG_JOYSTICK_XPAD=m
CONFIG_HID_MICROSOFT=m
CONFIG_HID_PLAYSTATION=m
CONFIG_HID_SONY=m
CONFIG_HID_NINTENDO=m
CONFIG_HID_LOGITECH=m
CONFIG_HID_LOGITECH_HIDPP=m
CONFIG_HID_STEAM=m

# Per-driver force feedback, outside the validated contract: these are driver-internal and
# come and go between kernel versions.
CONFIG_JOYSTICK_XPAD_FF=y
CONFIG_PLAYSTATION_FF=y
CONFIG_SONY_FF=y
CONFIG_NINTENDO_FF=y
CONFIG_LOGITECH_FF=y
CONFIG_STEAM_FF=y
