# Native Linux game-controller support, shared by every shipping WendyOS kernel.
#
# The interfaces applications bind to are built in so an entitled service never races a
# module load; transports and vendor quirk drivers stay modular because they matter only
# once a controller is attached. conf/distro/include/game-controller.inc is the contract
# this fragment has to satisfy, and what the resolved config is checked against.

# Input and HID cores, plus the menu gates the drivers below hang off.
CONFIG_INPUT=y
CONFIG_INPUT_EVDEV=y
CONFIG_INPUT_JOYSTICK=y
CONFIG_HID=y
CONFIG_HID_GENERIC=y
CONFIG_HIDRAW=y
CONFIG_USB_HID=y
CONFIG_UHID=m
CONFIG_INPUT_JOYDEV=m
CONFIG_INPUT_FF_MEMLESS=m

# Bluetooth transport. HIDP's Kconfig parents are requested here too, so the contract
# never rests on what a BSP defconfig happens to leave enabled.
CONFIG_BT=m
CONFIG_BT_BREDR=y
CONFIG_BT_HIDP=m

# Vendor drivers. hid-generic drives an unknown pad, but only these expose the full axis,
# touchpad, LED and battery behaviour of the controllers people actually own.
CONFIG_JOYSTICK_XPAD=m
CONFIG_HID_MICROSOFT=m
CONFIG_HID_PLAYSTATION=m
CONFIG_HID_SONY=m
CONFIG_HID_NINTENDO=m
CONFIG_HID_LOGITECH=m
CONFIG_HID_LOGITECH_HIDPP=m
CONFIG_HID_STEAM=m

# Each driver's own force feedback, riding on ff-memless above. Deliberately outside the
# validated contract: these are driver-internal and come and go between kernel versions.
CONFIG_JOYSTICK_XPAD_FF=y
CONFIG_PLAYSTATION_FF=y
CONFIG_SONY_FF=y
CONFIG_NINTENDO_FF=y
CONFIG_LOGITECH_FF=y
CONFIG_STEAM_FF=y
