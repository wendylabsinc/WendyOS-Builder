# Driver add-ons are squashfs images, loop-mounted and merged onto /usr through an overlay
# with a writable layer. Built in rather than modules: they must be available before the
# first add-on is merged, which is ahead of any module auto-load.
CONFIG_BLK_DEV_LOOP=y
CONFIG_SQUASHFS=y
CONFIG_SQUASHFS_XZ=y
CONFIG_SQUASHFS_XATTR=y
CONFIG_OVERLAY_FS=y
