# Sign every module at build time so enabling enforcement later is a config change rather
# than a pipeline change. MODULE_SIG_FORCE stays off: an unsigned or foreign-signed module
# still loads, tainted, which keeps bench and development workflows working.
CONFIG_MODULE_SIG=y
CONFIG_MODULE_SIG_ALL=y
CONFIG_MODULE_SIG_SHA256=y
# CONFIG_MODULE_SIG_FORCE is not set
