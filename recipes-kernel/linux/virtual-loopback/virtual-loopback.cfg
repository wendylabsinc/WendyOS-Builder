# Turn on only what the loopback drivers need. Media and sound stay at the
# board's setting, module or built-in. Forcing media support built-in also
# forces helper drivers, such as the I2C multiplexer, built-in against the
# board's settings.
CONFIG_MEDIA_CAMERA_SUPPORT=y
CONFIG_MEDIA_USB_SUPPORT=y
CONFIG_USB=y
# UVC selects the hidden VIDEOBUF2_VMALLOC allocator used by v4l2loopback.
CONFIG_USB_VIDEO_CLASS=m

# ALSA loopback supplies local PCM devices for virtual microphones.
CONFIG_SND_DRIVERS=y
CONFIG_SND_ALOOP=m
