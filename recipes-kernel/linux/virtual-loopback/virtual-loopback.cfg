# Turn on what the loopback drivers need, plus the USB webcam driver. Media and
# sound stay at the board's setting, module or built-in. Forcing media support
# built-in also forces helper drivers, such as the I2C multiplexer, built-in
# against the board's settings.
CONFIG_MEDIA_CAMERA_SUPPORT=y
# USB webcam (UVC) driver and the USB options it depends on. The VM has no USB
# camera by default. This lets a camera passed in with extra QEMU arguments
# work. On the arm64 VM no other kernel setting turns this driver on.
CONFIG_MEDIA_USB_SUPPORT=y
CONFIG_USB=y
CONFIG_USB_VIDEO_CLASS=m

# ALSA loopback supplies local PCM devices for virtual microphones.
CONFIG_SND_DRIVERS=y
CONFIG_SND_ALOOP=m
