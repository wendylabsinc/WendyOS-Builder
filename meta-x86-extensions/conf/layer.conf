BBPATH:prepend := "${LAYERDIR}:"

BBFILES += " \
    ${LAYERDIR}/recipes-*/*/*.bb \
    ${LAYERDIR}/recipes-*/*/*.bbappend \
    "

BBFILE_COLLECTIONS += "wendyos-x86"
BBFILE_PATTERN_wendyos-x86 := "^${LAYERDIR}/"
BBFILE_PRIORITY_wendyos-x86 = "51"

# x86 .wks layouts (A/B) live in files/wic/ — the location blacksail oe-core
# mandates (its sanity checker rejects the older <layer>/wic, and its
# WKS_SEARCH_PATH only searches <layer>/files/wic). The append states that path
# outright so wic finds the layouts no matter how the search path is built.
WKS_SEARCH_PATH:append = ":${LAYERDIR}/files/wic"

# Only layered for the generic x86_64 board (see conf/template/include/bblayers/
# x86.inc), so its recipes never reach other boards. The board builds on
# blacksail; wrynose stays in the set as the fallback series.
LAYERSERIES_COMPAT_wendyos-x86 = "wrynose blacksail"
LAYERVERSION_wendyos-x86 = "1"
LAYERDEPENDS_wendyos-x86 = "core wendyos"

