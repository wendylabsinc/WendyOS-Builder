BBPATH:prepend := "${LAYERDIR}:"

BBFILES += " \
    ${LAYERDIR}/recipes-*/*/*.bb \
    ${LAYERDIR}/recipes-*/*/*.bbappend \
    "

BBFILE_COLLECTIONS += "wendyos-rockchip"
BBFILE_PATTERN_wendyos-rockchip := "^${LAYERDIR}/"
BBFILE_PRIORITY_wendyos-rockchip = "51"

# Only layered for the Rockchip boards (see conf/template/include/bblayers/
# rockchip.inc), so its recipes and bbappends never reach other boards.
LAYERSERIES_COMPAT_wendyos-rockchip = "blacksail"
LAYERVERSION_wendyos-rockchip = "1"
LAYERDEPENDS_wendyos-rockchip = "core wendyos rockchip"
