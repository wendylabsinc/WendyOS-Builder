# WendyOS kernel deltas for Rockchip boards on top of the arm64 defconfig.

# Root path, built in. There is no initramfs, so the controller of whatever disk
# holds the rootfs must be in the kernel: microSD (dw_mmc), eMMC (sdhci) or NVMe
# behind the DesignWare PCIe controller and its combo PHY.
CONFIG_MMC_DW_ROCKCHIP=y
CONFIG_MMC_SDHCI_OF_DWCMSHC=y
CONFIG_PCIE_ROCKCHIP_DW_HOST=y
CONFIG_PHY_ROCKCHIP_NANENG_COMBO_PHY=y
CONFIG_BLK_DEV_NVME=y
CONFIG_EXT4_FS=y
CONFIG_EFI_PARTITION=y

# The HYM8563 RTC, built in so the clock is set before userspace. On the
# Orange Pi 5 Pro it is also the 32 kHz clock of the Wi-Fi power sequence and
# the Bluetooth controller.
CONFIG_RTC_DRV_HYM8563=y

# Motorcomm YT6801 PCIe Ethernet (Orange Pi 5 Pro), new in Linux 7.0.
CONFIG_DWMAC_MOTORCOMM=m

# RK3588 NPU (accel/rocket).
CONFIG_DRM_ACCEL=y
CONFIG_DRM_ACCEL_ROCKET=m

# nfs-server.service, enabled image-wide, needs nfsd; the arm64 defconfig lacks it.
CONFIG_NFSD=m
