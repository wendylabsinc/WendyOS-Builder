# WendyOS on Rockchip: one image boots from microSD, eMMC or NVMe.

# The boot script counts trial boots with setexpr, saves uboot.env with fatwrite,
# checks its size with itest and compares its backup with cmp; the bootcmd
# sleeps before a retry.
CONFIG_CMD_SETEXPR=y
CONFIG_FAT_WRITE=y
CONFIG_CMD_ITEST=y
CONFIG_CMD_MEMORY=y
CONFIG_CMD_SLEEP=y
CONFIG_CMD_NVME=y
CONFIG_CMD_PART=y

# Equal to WENDYOS_UBOOT_ENV_SIZE: env export -c is bounded by ENV_SIZE, so a
# larger value would save an oversized env truncated instead of failing.
CONFIG_ENV_SIZE=0x8000

# No autoboot prompt: a stray byte on the debug UART must not stop the boot.
CONFIG_BOOTDELAY=-2

# First disk whose p1 holds the Rockchip script wins: microSD (mmc 1), eMMC
# (mmc 0), then NVMe. The family-specific name keeps a Pi card's boot.scr out.
# The script never returns, so reaching the end means nothing booted (an NVMe
# link that stayed down on a cold boot, say): reset and try again rather than
# wait at a prompt nobody sees. Ctrl-C during the sleep keeps the prompt.
CONFIG_BOOTCOMMAND="if test -e mmc 1:1 wendyos-rockchip.scr; then setenv devtype mmc; setenv devnum 1; elif test -e mmc 0:1 wendyos-rockchip.scr; then setenv devtype mmc; setenv devnum 0; else pci enum; nvme scan; setenv devtype nvme; setenv devnum 0; fi; load ${devtype} ${devnum}:1 ${scriptaddr} wendyos-rockchip.scr && source ${scriptaddr}; echo wendyos: no boot script ran, resetting in 5 seconds; sleep 5 && reset"
