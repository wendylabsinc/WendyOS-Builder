
# Make the layer visible to bitbake
BBPATH:prepend := "${LAYERDIR}:"

# Where to find recipes in this layer. Anchored at recipes-* directly under
# LAYERDIR, so nothing under dynamic-layers/ is picked up here -- see below.
BBFILES += " \
    ${LAYERDIR}/recipes-*/*/*.bb \
    ${LAYERDIR}/recipes-*/*/*.bbappend \
    "

# Content that only makes sense when another layer is present. meta-wendy is
# layered on every board, but meta-tpm (collection "tpm-layer") only on x86 and
# Tegra, and a bbappend whose recipe is absent is a hard error rather than a
# no-op. BBFILES_DYNAMIC is evaluated once after every layer.conf has been read,
# so it sees the complete collection list and does not depend on BBLAYERS order.
# Keep these globs anchored under dynamic-layers/: the unconditional BBFILES
# above must never be able to reach them.
BBFILES_DYNAMIC += " \
    tpm-layer:${LAYERDIR}/dynamic-layers/tpm-layer/recipes-*/*/*.bb \
    tpm-layer:${LAYERDIR}/dynamic-layers/tpm-layer/recipes-*/*/*.bbappend \
    "

# Register this layer
BBFILE_COLLECTIONS += "wendyos"
BBFILE_PATTERN_wendyos := "^${LAYERDIR}/"
BBFILE_PRIORITY_wendyos = "50"

# Active series: scarthgap (Orin/RPi/QEMU) and wrynose (Thor). Whinlatter
# was an interim during Thor bring-up but is non-LTS, EOL ~2026-05, and
# missing the c710879b4c kernel-initramfs cycle fix that wrynose has — no
# board pins it now. Drop it from the compat set if/when re-added, also
# add it to meta-tegra-extensions/conf/layer.conf.
LAYERSERIES_COMPAT_wendyos = "scarthgap wrynose blacksail"
LAYERVERSION_wendyos = "1"

# Dependencies on other layers (at minimum you depend on 'core')
LAYERDEPENDS_wendyos = "core"

# This is used by the tegra-distro-sanity bbclass
# to identify the distro layer directory during
# bblayers checks.
TD_DISTRO_LAYERDIR = "${LAYERDIR}"
