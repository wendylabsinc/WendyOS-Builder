# rpi4: Raspberry Pi 4 (64-bit) booting from SD or USB (blacksail tree).
# wendyos-update OTA. See repos.overrides for the blacksail pin rationale.

require ${TOPDIR}/../${WENDYOS_META_REPO}/conf/template/include/local/common.inc
require ${TOPDIR}/../${WENDYOS_META_REPO}/conf/template/include/local/usb-gadget.inc
require ${TOPDIR}/../${WENDYOS_META_REPO}/conf/template/include/local/rpi-blacksail.inc

# No STORAGE: the same image boots from SD or a USB disk.
DEVICE  = "raspberry-pi-4"
MACHINE = "raspberrypi4-64-wendyos"

