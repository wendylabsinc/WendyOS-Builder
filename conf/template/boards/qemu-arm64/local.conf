# qemu-arm64: QEMU aarch64 virtual machine

require ${TOPDIR}/../${WENDYOS_META_REPO}/conf/template/include/local/common.inc
require ${TOPDIR}/../${WENDYOS_META_REPO}/conf/template/include/local/qemu.inc

DEVICE  = "qemu-arm64"
STORAGE = "disk"
MACHINE = "qemuarm64-wendyos"

# Size in KB. 6 GiB, not the 4 GiB default, because /var/lib/containerd stays on
# the rootfs here: the OTA gate excludes systemd-mount-containerd, so container
# images get none of the room --disk adds to /data.
QEMU_ROOTFS_SIZE = "6291456"
