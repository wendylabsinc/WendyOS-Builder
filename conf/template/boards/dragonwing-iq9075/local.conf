# dragonwing-iq9075: Qualcomm Dragonwing IQ-9075 EVK (blacksail tree).
#
# QCS9075 / SA8775P family, board codename "lemans". The SoC's own UEFI
# chainloads GRUB from the ESP, which selects one of the two rootfs slots
# (WENDYOS_OTA = "wendy"). Needs this layer's rawprogram0.xml, not the stock
# single-rootfs one.

require ${TOPDIR}/../${WENDYOS_META_REPO}/conf/template/include/local/common.inc

# Bridge LAYERSERIES_COMPAT for meta-oe/meta-virtualization, which oe-common.inc
# layers and which have not declared blacksail upstream. Gated on
# WENDYOS_LAYER_TREE == "blacksail", inert elsewhere. meta-qcom's own bridge is in
# bblayers/qcom.inc -- it has to be, see the note in that file.
require ${TOPDIR}/../${WENDYOS_META_REPO}/conf/template/include/local/blacksail-compat.inc

DEVICE  = "dragonwing-iq-9075"
STORAGE = "ufs"
MACHINE = "iq-9075-evk-wendyos"
