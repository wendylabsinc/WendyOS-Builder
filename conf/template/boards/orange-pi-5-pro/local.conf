# orange-pi-5-pro: Orange Pi 5 Pro (Rockchip RK3588S), blacksail tree.
#
# One image boots from microSD or eMMC, or from NVMe when U-Boot comes from the
# eMMC or an SD card. wendyos-update OTA through U-Boot (ubootenv connector).

require ${TOPDIR}/../${WENDYOS_META_REPO}/conf/template/include/local/common.inc

# No STORAGE: the same image boots from SD, eMMC or NVMe.
DEVICE  = "orange-pi-5-pro"
MACHINE = "orangepi-5-pro-wendyos"
