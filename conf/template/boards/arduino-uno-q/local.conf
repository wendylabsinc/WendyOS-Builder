# arduino-uno-q: Arduino UNO Q (blacksail tree).
#
# Qualcomm Dragonwing QRB2210 / QCM2290 family, board codename "imola". Arduino's
# ABL and U-Boot chainload GRUB from the ESP, which selects one of the two rootfs
# slots (WENDYOS_OTA = "wendy"). Flashed over EDL from this layer's eMMC layout.

require ${TOPDIR}/../${WENDYOS_META_REPO}/conf/template/include/local/common.inc

DEVICE  = "arduino-uno-q"
STORAGE = "emmc"
MACHINE = "arduino-uno-q-wendyos"
