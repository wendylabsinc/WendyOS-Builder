#@TYPE: Machine
#@NAME: Unitree Go2 EDU expansion dock with Jetson Orin NX 16 GB
#@DESCRIPTION: P3767-0000 module on the Unitree Go2 EDU carrier with NVMe

require conf/machine/p3768-0000-p3767-0000.conf
require conf/machine/include/jetson-orin-any-disk-wendyos.inc

# Offline build defaults observed in the Unitree NX factory image. The
# Linux recovery helper checks the attached module's actual CVM identity.
TEGRA_FAB = "301"
TEGRA_BOARDREV = "G.1"

# Use NVIDIA's standard-power Orin NX profile. The Go2 dock has its own
# power and cooling envelope.
NVPMODEL = "nvpmodel_p3767_0000"
TEGRA_FLASHVAR_BPFDTB_FILE = "tegra234-bpmp-3767-0000-a02-3509-a02.dtb"
TEGRA_FLASHVAR_MB2BCT_CFG = "tegra234-mb2-bct-misc-unitree-go2.dts"
TEGRA_FLASHVAR_PINMUX_CONFIG = "tegra234-mb1-bct-pinmux-unitree-go2.dtsi"

PREFERRED_PROVIDER_virtual/dtb = "unitree-go2-devicetree"
KERNEL_DEVICETREE = "tegra234-unitree-go2-orin-nx.dtb"
UBOOT_EXTLINUX_FDT = "tegra234-unitree-go2-orin-nx.dtb"

MACHINE_FEATURES:remove = "wifi bluetooth"
MACHINE_EXTRA_RRECOMMENDS:remove = "nv-kernel-module-rtk-btusb tegra-firmware-rtl8822 ${DEVKIT_WIFI_RRECOMMENDS}"

UBOOT_EXTLINUX = "1"
USE_REDUNDANT_FLASH_LAYOUT_DEFAULT = "1"
TEGRA_UEFI_USE_SIGNED_FILES = "false"

TNSPEC_MACHINE = "unitree-go2-orin-nx"
WENDYOS_BOARD_ID = "unitree-go2"
WENDYOS_DRIVER_EXTENSIONS ?= "1"

IMAGE_NAME_SUFFIX = ""
IMAGE_FSTYPES:tegra = "tegraflash-tar"
IMAGE_FSTYPES:pn-tegra-minimal-initramfs:tegra = "${INITRAMFS_FSTYPES}"
IMAGE_FSTYPES:pn-tegra-initrd-flash-initramfs:tegra = "${TEGRA_INITRD_FLASH_INITRAMFS_FSTYPES}"
ROOTFSPART_SIZE_DEFAULT = "25769803776"
