#@TYPE: Machine
#@NAME: Arduino UNO Q
#@DESCRIPTION: WendyOS target for the Arduino UNO Q
#              (Qualcomm Dragonwing QRB2210, QCM2290 SoC family, board codename "imola").

# meta-qcom has no UNO Q machine, so this conf is the board layer on top of the
# SoC include. "qcom-wendyos" is the WendyOS dispatch token the distro/image
# includes key on; the board's own recipes live in meta-arduino-extensions.
MACHINEOVERRIDES =. "qcom-wendyos:"
require conf/machine/include/qcom-qcm2290.inc

MACHINE_FEATURES = "efi usbhost usbgadget alsa wifi bluetooth"

KERNEL_DEVICETREE = "qcom/qrb2210-arduino-imola.dtb"
WENDYOS_QCOM_DTB = "qrb2210-arduino-imola.dtb"

# No dtb partition: GRUB loads the DTB from the rootfs slot. Empty, not unset, or
# meta-qcom's multi-dtb default applies.
QCOM_DTB_DEFAULT = ""

# Arduino's own boot firmware: ABL loads Arduino's U-Boot, whose UEFI runs GRUB.
# No CDT: the board keeps its own in the eMMC boot partitions, which the flash
# never writes.
QCOM_BOOT_FILES_SUBDIR = "arduino-uno-q"
QCOM_BOOT_FIRMWARE = "firmware-arduino-uno-q-boot"

# From GRUB on, the A/B boot chain of the Dragonwing EVKs: GRUB on the ESP ->
# kernel from the selected ext4 slot, updated by wendyos-update.
WENDYOS_OTA = "wendy"
EFI_PROVIDER = "grub-efi"
QCOM_ESP_IMAGE = "wendyos-esp-image"
PREFERRED_RPROVIDER_virtual-grub-bootconf = "wendyos-grub-ab"
QCOM_BOOTIMG_ROOTFS = "PARTLABEL=rootfsA"
WENDYOS_UPDATE_BOOTLOADER = "0"
WENDYOS_EFI_DEBUG = "0"

# grub.cfg owns the kernel command line, so the SoC's arguments are passed through,
# plus the deferred-probe timeout the vendor images boot with.
WENDYOS_QCOM_KERNEL_ARGS = "${KERNEL_CMDLINE_EXTRA} deferred_probe_timeout=30"

# eMMC has one GPT for firmware and OS alike, so the layout is this board's own
# (meta-arduino-extensions/recipes-bsp/partition/files/partitions.conf).
QCOM_PARTITION_CONF = "wendyos-partition-conf"
QCOM_PARTITION_FILES_SUBDIR = "partitions/${MACHINE}/emmc"

# Two slots must fit the smallest SKU's 16 GB eMMC beside the boot firmware.
# partitions.conf repeats the size, which the partition and GRUB recipes assert.
WENDYOS_ROOTFS_SIZE_KB:arduino-uno-q-wendyos = "4194304"

# The only dwc3 controller; the ANX7625 Type-C port drives its role.
WENDYOS_USB_GADGET = "1"
WENDYOS_USB_UDC = "4e00000.usb"

# As on the Dragonwing EVKs: no /data encryption, TPM or NVIDIA stack.
WENDYOS_DATA_ENCRYPTED = "0"
WENDYOS_ENABLE_TPM = "0"
WENDYOS_DEEPSTREAM = "0"

WENDYOS_QCOM_BOARD_PACKAGEGROUP = "packagegroup-wendyos-arduino-uno-q"

# Stable board identity written to /etc/wendyos/device-type
WENDYOS_BOARD_ID = "arduino-uno-q"
