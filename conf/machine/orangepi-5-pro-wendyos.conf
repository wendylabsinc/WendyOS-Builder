#@TYPE: Machine
#@NAME: Orange Pi 5 Pro (WendyOS)
#@DESCRIPTION: Xunlong Orange Pi 5 Pro, Rockchip RK3588S. One image boots from microSD, eMMC or NVMe.

# rockchip-wendyos is the WendyOS family token. meta-rockchip has no machine for
# this board, so it builds on the SoC include directly.
MACHINEOVERRIDES =. "rockchip-wendyos:"

# Plain Image + DTB, loaded from the booted slot by the boot script. Set before
# the SoC include, which reads it to pick a FIT kernel.
RK_KERNEL_FITIMAGE = "False"

require conf/machine/include/rk3588s.inc
require conf/machine/include/rockchip-common-wendyos.inc

# The board DTS first shipped in Linux 7.3; the kernel and U-Boot bbappends
# backport it.
KERNEL_DEVICETREE = "rockchip/rk3588s-orangepi-5-pro.dtb"
UBOOT_MACHINE = "orangepi-5-pro-rk3588s_defconfig"

# Stable board identity written to /etc/wendyos/device-type
WENDYOS_BOARD_ID = "orange-pi-5-pro"

WENDYOS_ROCKCHIP_BOARD_PACKAGEGROUP = "packagegroup-wendyos-orangepi-5-pro"

# No USB gadget: the USB-C port is power only, and the USB 3 port's controller
# is fixed to host mode in the DTS (dr_mode = "host").
WENDYOS_USB_GADGET = "0"

MACHINE_FEATURES:append = " wifi bluetooth"
