#@TYPE: Machine
#@NAME: Unitree G1 EDU PC2 with Jetson Orin NX 16 GB
#@DESCRIPTION: P3767-0000 on the G1 EDU development computer with internal NVMe

require conf/machine/p3768-0000-p3767-0000.conf
require conf/machine/include/jetson-orin-any-disk-wendyos.inc

# Offline signing uses the P3767-0000 production revision as a starting point.
# Verify the module fitted to PC2 before the first hardware flash.
TEGRA_FAB = "301"
TEGRA_BOARDREV = "G.1"
NVPMODEL = "nvpmodel_p3767_0000"
TEGRA_FLASHVAR_BPFDTB_FILE = "tegra234-bpmp-3767-0000-a02-3509-a02.dtb"
TEGRA_FLASHVAR_MB2BCT_CFG = "tegra234-mb2-bct-misc-unitree-g1-pc2.dts"

PREFERRED_PROVIDER_virtual/dtb = "unitree-g1-pc2-devicetree"
KERNEL_DEVICETREE = "tegra234-unitree-g1-pc2-orin-nx.dtb"
UBOOT_EXTLINUX_FDT = "tegra234-unitree-g1-pc2-orin-nx.dtb"

# The reference kit's Wi-Fi module differs from the G1 carrier radio.
MACHINE_EXTRA_RRECOMMENDS:remove = "tegra-firmware-rtl8822 ${DEVKIT_WIFI_RRECOMMENDS}"

UBOOT_EXTLINUX = "1"
USE_REDUNDANT_FLASH_LAYOUT_DEFAULT = "1"
TEGRA_UEFI_USE_SIGNED_FILES = "false"
TNSPEC_MACHINE = "unitree-g1-pc2-orin-nx"
WENDYOS_BOARD_ID = "unitree-g1-pc2"
WENDYOS_DRIVER_EXTENSIONS ?= "1"

IMAGE_NAME_SUFFIX = ""
IMAGE_FSTYPES:tegra = "tegraflash-tar"
IMAGE_FSTYPES:pn-tegra-minimal-initramfs:tegra = "${INITRAMFS_FSTYPES}"
IMAGE_FSTYPES:pn-tegra-initrd-flash-initramfs:tegra = "${TEGRA_INITRD_FLASH_INITRAMFS_FSTYPES}"
ROOTFSPART_SIZE_DEFAULT = "25769803776"
