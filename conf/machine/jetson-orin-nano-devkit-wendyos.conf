
# jetson-orin-nano-devkit-wendyos.conf

MACHINEOVERRIDES =. "jetson-orin-nano-devkit:"

# include upstream base if available
require conf/machine/jetson-orin-nano-devkit.conf

# AB upgrades & bootloader choices (board-specific)
UBOOT_EXTLINUX = "1"
USE_REDUNDANT_FLASH_LAYOUT_DEFAULT = "1"

# UEFI Capsule Update Configuration
# Disable Secure Boot for development/testing (no signing keys configured)
# When "false": No key enrollment, Secure Boot disabled, unsigned capsules accepted
# Set to "true" for production after implementing proper signing infrastructure
TEGRA_UEFI_USE_SIGNED_FILES = "false"

# Storage geometry (board-specific)
#
# TEGRAFLASH_SDCARD_SIZE is baked into dosdcard.sh by image_types_tegra.bbclass
# at recipe time (upstream default "16G") and accepts no runtime override.
# 64G requires a 64 GB minimum SD card.
TEGRAFLASH_SDCARD_SIZE = "64G"

# The persistent data partition (id 17, after APP_b) is inserted by
# tegra_partition_config.bbclass — allocated empty at flash time, formatted
# and grown to 100% on first boot by wendyos-data-setup. UDA (p15) is NOT
# used: it is reserved by NVIDIA and positioned before the rootfs
# partitions, preventing expansion.

# BUP (Bootloader Update Payload) must not reference data partition images
TEGRA_BUPGEN_STRIP_IMG_NAMES:append = " config-partition.fat32.img"

# wendyos-update OTA (blacksail/JP7.2): a single flashable tegraflash-tar
# (the r38+ IMAGE_TYPE rename, as on Thor).
IMAGE_FSTYPES:tegra = "tegraflash-tar"

# blacksail oe-core defaults IMAGE_NAME_SUFFIX to ".rootfs", which would push
# ".rootfs" into deployed artifact/symlink names; the publisher + CI expect
# none.
IMAGE_NAME_SUFFIX = ""
IMAGE_FSTYPES:pn-tegra-minimal-initramfs:tegra = "${INITRAMFS_FSTYPES}"
IMAGE_FSTYPES:pn-tegra-initrd-flash-initramfs:tegra = "${TEGRA_INITRD_FLASH_INITRAMFS_FSTYPES}"

# If you really need it, board param (but consider removing if unused):
EMMC_SIZE = "0"

# Size each A/B APP slot to exactly the fixed 12 GiB rootfs image
# (conf/distro/include/wendyos-rootfs-size.inc): the redundant layout halves
# ROOTFSPART_SIZE_DEFAULT per slot and image_types_tegra.bbclass substitutes
# it for APPSIZE in the layout XML, so slot == image == .wendy OTA payload
# (docs/plans/fixed-rootfs-sizes.md). Replaces the upstream meta-tegra
# default; the reclaimed space goes to the data partition, grown to 100%
# on first boot.
ROOTFSPART_SIZE_DEFAULT = "25769803776"

# Stable board identity written to /etc/wendyos/device-type
WENDYOS_BOARD_ID = "jetson-orin-nano"

# Mainline Bluetooth (btusb+btrtl) replaces NVIDIA's out-of-tree rtk_btusb
# for the devkit's RTL8822CE radio, which drops BLE HID links in a ~2 s
# connect/drop loop (kernel side of the swap: wendy-bluetooth.inc via the
# jp7 kernel bbappend; firmware + modprobe blacklist: tegra-packagegroup-base).
# These hard assignments override upstream ?= defaults from devkit-wifi.inc
# and nvidia-kernel-oot.inc; BAD_RECOMMENDATIONS is the catch-all for any
# other RRECOMMENDS edge that would drag the vendor packages back in.
# tegra-firmware-rtl8822 is the vendor-layout BT firmware (/lib/firmware
# root); mainline btrtl loads from linux-firmware-rtl8822's rtl_bt/ instead.
# Keep in sync with jetson-orin-nano-devkit-nvme-wendyos.conf.
TEGRA_OOT_BLUETOOTH_DRIVERS = ""
NVIDIA_WIFI = "kernel-module-rtl8822ce"
LINUX_WIFI = "kernel-module-rtw88-8822ce"
BAD_RECOMMENDATIONS:append = " \
    kernel-module-rtk-btusb \
    nv-kernel-module-rtk-btusb \
    kernel-module-bluedroid-pm \
    nv-kernel-module-bluedroid-pm \
    tegra-firmware-rtl8822 \
    "
