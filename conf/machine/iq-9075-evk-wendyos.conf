#@TYPE: Machine
#@NAME: Qualcomm Dragonwing IQ-9075 EVK
#@DESCRIPTION: WendyOS target for the Qualcomm Dragonwing IQ-9075 Evaluation Kit
#              (QCS9075, SA8775P SoC family, board codename "lemans").

# "qcom-wendyos" is the WendyOS dispatch token the distro/image includes key on;
# it deliberately does NOT reuse meta-qcom's own "qcom" override, which upstream
# already sets. "iq-9075-evk" is re-added because MACHINE is the wrapper name, so
# the upstream board override would otherwise be absent.
MACHINEOVERRIDES =. "qcom-wendyos:iq-9075-evk:"
require conf/machine/iq-9075-evk.conf
require conf/machine/include/dragonwing-common-wendyos.inc

# Upstream keys the flash-package lookups on literal strings, not ${MACHINE}
# (QCOM_BOOT_FILES_SUBDIR = "qcs9100"), so the wrapper rename does not break them.
# Only MACHINE_ARCH changes, which just re-namespaces machine-specific sstate.

# Device tree the A/B GRUB config loads from each slot. meta-qcom's
# KERNEL_DEVICETREE lists several for this SoC; this names the one this board
# boots, and wendyos-grub-ab asserts it is one the kernel installs.
WENDYOS_QCOM_DTB = "lemans-evk.dtb"

# The DSP userspace package prefix and Hexagon version. Neither is derivable from
# MACHINE. _SOC is asserted against WENDYOS_QCOM_DSP_SOCS: a SoC missing from the
# retarget list builds green and then refuses every offload at runtime.
WENDYOS_QCOM_NPU_BOARD = "iq9075-evk"
WENDYOS_QCOM_NPU_DSP_ARCH = "v73"
WENDYOS_QCOM_NPU_SOC = "sa8775p"

# Stable board identity written to /etc/wendyos/device-type
WENDYOS_BOARD_ID = "dragonwing-iq-9075"
