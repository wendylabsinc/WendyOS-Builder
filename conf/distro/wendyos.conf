
# OTA stack selector. One of:
#   "wendy"   the wendyos-update A/B OTA client (docs/plans/wendy-ota-update.md).
#   "none"    no OTA stack (and no /data services).
# The OTA-runtime /data services and persistent journal key off this being
# anything other than "none". WendyOS uses the wendyos-update OTA stack only.
# Default: "wendy" on real hardware, "none" for QEMU. Override per-machine
# or in local.conf.
WENDYOS_OTA ?= "${@'none' if 'qemuall' in d.getVar('MACHINEOVERRIDES').split(':') else 'wendy'}"

# Persistent /data partition in the Tegra flash layout. A separate, lower-
# level flag than WENDYOS_OTA: it only controls whether the partition is
# carved into the flash layout, so a board can have /data without an OTA
# stack (e.g. bring-up / testing). Defaults to "1" whenever an OTA stack
# is selected. The partition is allocated empty (no <filename>) and
# formatted on first boot. Consumed by tegra_partition_config.bbclass.
WENDYOS_DATA_PART ?= "${@'0' if d.getVar('WENDYOS_OTA') == 'none' else '1'}"

# Resolve libnss-mdns runtime provider ambiguity. Wrynose oe-core split
# Avahi's NSS plugin into a standalone avahi-libnss-mdns recipe, which
# competes with meta-networking's mdns (Apple's mDNSResponder) as an
# RPROVIDER of libnss-mdns. We use Avahi, so prefer it.
PREFERRED_RPROVIDER_libnss-mdns = "avahi-libnss-mdns"

require conf/distro/poky.conf
require systemd.conf

# wendyos-update OTA stack (client + data-setup + the .wendy artifact +
# the fixed rootfs-size pin). Gated on WENDYOS_OTA == "wendy" (above).
require ${@'conf/distro/include/wendyos-update.inc'      if d.getVar('WENDYOS_OTA') == 'wendy' else ''}

# Conditionally require L4T version-pinning only for Tegra machines.
#   - blacksail tree (JetPack 7.2 / L4T r39.2.0): pin NOTHING. The pinned
#     meta-tegra is single-version and self-defaults L4T_VERSION ?= "39.2.0"
#     (classes/l4t_version.bbclass) plus CUDA 13.2 / cuDNN 9.20 / TensorRT
#     10.16, so its native recipes are authoritative; a hand-pinned file would
#     only risk mis-pinning. Every board is on blacksail, so this is the live
#     path for all of them (Thor and Orin alike).
#   - tegra264 on the wrynose fallback tree (Thor): pin L4T 38.4.0 (JetPack 7.1).
#   - non-Tegra (qemuarm64, raspberrypi*, genericx86-64): pin nothing.
require ${@'' if d.getVar('WENDYOS_LAYER_TREE') == 'blacksail' else ('conf/distro/include/l4t-r38-4-0.conf' if 'tegra264' in d.getVar('MACHINEOVERRIDES').split(':') else '')}

# Network management with NetworkManager
DISTRO_FEATURES:append = " networkmanager"
VIRTUAL-RUNTIME_net_manager = "networkmanager"

# Optional: Use systemd-resolved for DNS (alternative to dnsmasq)
# DISTRO_FEATURES:append = " resolved"

DISTRO = "wendyos"
DISTROOVERRIDES = "poky"

DISTRO_NAME = "WendyOS Linux platform"
DISTRO_VERSION = "0.19.1"
# DISTRO_CODENAME is inherited from poky.conf (require'd above), which
# sets it to the active oe-core series ("wrynose", "blacksail", ...).
# Don't override here or it gets stuck on a stale value across series.

SDK_VENDOR = "-wendyossdk"
SDK_VERSION = "${@d.getVar('DISTRO_VERSION')}"
SDK_NAME = "${DISTRO}-${TCLIBC}-${SDKMACHINE}-${IMAGE_BASENAME}-${TUNE_PKGARCH}-${MACHINE}"
SDKPATHINSTALL = "/opt/${DISTRO}/${SDK_VERSION}"

# MAINTAINER = "name <email>"

# remove distro unnecessary feature(s)
DISTRO_FEATURES:remove = " \
    x11 \
    wayland \
    sysvinit \
    ptest \
    3g \
    "

# Add OpenGL support for TensorRT
DISTRO_FEATURES:append = " opengl"

# Accept commercial LICENSE_FLAGS for gstreamer1.0-plugins-ugly (x264enc/x264)
LICENSE_FLAGS_ACCEPTED += "commercial"

# Add virtualization support for NVIDIA Container Toolkit
DISTRO_FEATURES:append = " virtualization"

# Add seccomp support. crun's PACKAGECONFIG enables its seccomp backend when
# this DISTRO_FEATURE is present; it also enables seccomp enforcement
# system-wide.
DISTRO_FEATURES:append = " seccomp"

# Use crun as the OCI container runtime instead of runc. crun is a fast,
# low-memory C implementation and a drop-in for the runc CLI the
# containerd-shim-runc-v2 shim invokes. The crun bbappend exposes it under the
# "runc" binary name (update-alternatives) and RPROVIDES virtual-runc, so
# containerd's ${VIRTUAL-RUNTIME_container_runtime} dependency resolves to crun.
VIRTUAL-RUNTIME_container_runtime = "crun"

# recipes-containers/crun/crun_git.bb in this layer vendors crun 1.28.0
# (2026-05-27); pin to it so bitbake resolves crun deterministically instead of
# picking whatever version meta-virtualization happens to carry. Update
# alongside that recipe when bumping crun.
PREFERRED_VERSION_crun = "1.28.0+git"

# crun's bbappend declares PROVIDES += "virtual/runc". The default preferred
# provider for that virtual is runc(-opencontainers), so without this override
# bitbake skips the crun recipe ("PREFERRED_PROVIDER_virtual/runc set to runc,
# not crun") and crun becomes unbuildable. Make crun win the selection so it
# fully replaces runc as the build- and runtime-level OCI runtime.
PREFERRED_PROVIDER_virtual/runc = "crun"

# Add polkit for rtkit support (real-time audio priority)
DISTRO_FEATURES:append = " polkit"

# WendyOS Configuration Variables
# These can be overridden in local.conf or on the command line
WENDYOS_UPDATE_BOOTLOADER ?= "1"

# Container runtime (containerd + nerdctl + CNI). All in-tree machines need it;
# set to "0" in a machine conf to opt out.
WENDYOS_CONTAINER_RUNTIME ?= "1"

# Build host support (BuildKit). Lets `wendy run --build-host <device>` build
# container images on this device instead of a developer's laptop, which matters
# when the developer is remote: an edge image push measured ~67 KB/s over a home
# link, versus minutes on the office network.
#
# Off by default, and for two separate reasons. BuildKit is ~85 MB of binaries
# that most devices will never use, and running builds for other people is a
# thing a device should opt into rather than acquire by being reachable -- the
# agent enforces the second half separately, gating BuildImage on its own
# marker file, so this flag is about whether the daemon is on the image at all.
#
# Opt in on boards that are actually meant to build: the Sparks and the AGX
# Thors, not a camera box.
WENDYOS_BUILD_HOST ?= "0"

# Driver add-ons (systemd-sysext). Adds the kernel prerequisites for merging a driver
# image at runtime, plus module signing. Off by default; opted into per machine so a
# board only takes the kernel delta once it is actually shipping driver support.
WENDYOS_DRIVER_EXTENSIONS ?= "0"

# The merge needs sysext mutable mode, added in systemd 256. Gate the opt-in on the
# blacksail tree, the only one whose systemd is verified new enough, so a board on any
# other tree cannot ship a merge service that fails on every boot. Machine confs are
# parsed before this file, so a board's opt-in is already set here and is overridden.
# Immediate expansion because this reads the value it replaces.
WENDYOS_DRIVER_EXTENSIONS := "${@d.getVar('WENDYOS_DRIVER_EXTENSIONS') if d.getVar('WENDYOS_LAYER_TREE') == 'blacksail' else '0'}"

# The compatibility level a driver add-on is matched against. systemd compares an add-on's
# SYSEXT_LEVEL with the host's when both declare one, and falls back to VERSION_ID when
# they do not — which would invalidate every published add-on on each patch release. Set
# distro-wide and unconditionally: os-release is allarch, and a machine that ships no
# add-ons is unharmed by the extra field. Bump only on a breaking change to what an add-on
# may rely on.
WENDYOS_SYSEXT_LEVEL ?= "1"

# USB gadget network mode for the usb0 interface
# "link-local"  - RFC 3927 self-assigned 169.254.x.x (discovery via mDNS/Avahi)
# "dhcp-client" - Device is DHCP client (host must run DHCP server)
# "dhcp-server" - Device runs DHCP server via NM shared mode (requires dnsmasq)
WENDYOS_USB_NET_MODE ?= "link-local"

# Interfaces on which Avahi publishes mDNS services
# Default: usb0 only (device discoverable only by the directly-connected host)
# Set to "" to allow all interfaces (discoverable on LAN)
WENDYOS_MDNS_INTERFACES ?= ""

# Enable UEFI/EFI debug build for verbose boot/capsule debug output
# Set to "1" to enable DEBUG mode (verbose UART output)
# Set to "0" for RELEASE mode (minimal output, production default)
WENDYOS_EFI_DEBUG ?= "0"

# Enable persistent journal logs on /data partition.
# Default tracks WENDYOS_OTA: when an OTA stack provides /data we persist
# logs there; when there's no OTA stack (QEMU, RPi machines that haven't
# opted in) logs are volatile. Override per-machine or in local.conf.
WENDYOS_PERSIST_JOURNAL_LOGS ?= "${@'0' if d.getVar('WENDYOS_OTA') == 'none' else '1'}"

# Config partition (FAT32, mountable on Linux/macOS/Windows)
# Used by Jetson XML layouts and RPi5 WKS files
WENDYOS_CONFIG_PART_SIZE_MB ?= "256"
WENDYOS_CONFIG_PART_NUMBER ?= "16"

# Include hardware-specific distro configuration
require ${@'conf/distro/include/qemu-distro.inc' if 'qemuall' in d.getVar('MACHINEOVERRIDES').split(':') else ''}
require ${@'conf/distro/include/rpi-distro.inc'  if 'rpi'     in d.getVar('MACHINEOVERRIDES').split(':') else ''}
require ${@'conf/distro/include/x86-distro.inc'  if 'x86-wendyos' in d.getVar('MACHINEOVERRIDES').split(':') else ''}

# Driver add-ons (systemd-sysext): systemd's sysext support, the boot-time merge
# service and the kernel devkit. Gated on WENDYOS_DRIVER_EXTENSIONS, so it must
# stay below the blacksail veto above, which rewrites that value. Also gated on
# rpi: the kernel side is board-neutral (recipes-kernel/linux/driver-extensions.inc)
# but only the RPi kernel bbappend requires it so far, so without this clause the
# knob would ship the merge service onto a machine whose kernel cannot mount an
# add-on. Drop the clause per board as each one's kernel bbappend is wired.
require ${@'conf/distro/include/driver-extensions.inc' if d.getVar('WENDYOS_DRIVER_EXTENSIONS') == '1' and 'rpi' in d.getVar('MACHINEOVERRIDES').split(':') else ''}

# /var/log placement: persistent storage vs tmpfs. Trim
# files/fs-perms-volatile-log.txt out of the default FILESYSTEM_PERMS_TABLES
# when /var/log should be persistent. The oe-core default is
# "files/fs-perms.txt files/fs-perms-volatile-log.txt
# files/fs-perms-volatile-tmp.txt". Removing the volatile-log entry makes
# /var/log persistent (on rootfs); leaving it makes /var/log volatile
# (tmpfs). /tmp stays volatile in both cases. The older VOLATILE_LOG_DIR
# variable must NOT be used — oe-core rejects it via BB_RENAMED_VARIABLES.
#
# WENDYOS_PERSIST_JOURNAL_LOGS = "1" → /var/log is persistent.
# WENDYOS_PERSIST_JOURNAL_LOGS = "0" → /var/log is volatile (default).
FILESYSTEM_PERMS_TABLES:remove = "${@'files/fs-perms-volatile-log.txt' if d.getVar('WENDYOS_PERSIST_JOURNAL_LOGS') == '1' else ''}"

PACKAGE_CLASSES ?= "package_rpm"
# PACKAGE_CLASSES = "package_ipk"

# Runtime package management policy.
# "0" = no package manager binaries in the rootfs (default; image is updated
#       atomically via the A/B OTA).
# "1" = include rpm/dnf for runtime package operations on the device.
WENDYOS_ENABLE_PACKAGE_MANAGEMENT ?= "0"

# When disabled, suppress the OE-core backfill that would otherwise add
# 'package-management' to IMAGE_FEATURES (see IMAGE_FEATURES_BACKFILL in
# poky's conf/bitbake.conf).
IMAGE_FEATURES_BACKFILL_CONSIDERED += "${@bb.utils.contains('WENDYOS_ENABLE_PACKAGE_MANAGEMENT', '1', '', 'package-management', d)}"

SANITY_TESTED_DISTROS ?= " \
    ubuntu-20.04 \n\
    ubuntu-22.04 \n\
    ubuntu-24.04 \n\
    "

# require conf/distro/include/poky-world-exclude.inc
# require conf/distro/include/no-static-libs.inc
# require conf/distro/include/yocto-uninative.inc
# require conf/distro/include/security_flags.inc

USE_REDUNDANT_FLASH_LAYOUT_DEFAULT ?= "1"

# INHERIT += "tegra-support-sanity"
# ESDK_CLASS_INHERIT_DISABLE:append = " tegra-support-sanity"

BB_SIGNATURE_HANDLER ?= "OEEquivHash"
BB_HASHSERVE ??= "auto"

# SBOM generation adds a do_create_spdx task per recipe plus rootfs-time
# image/runtime SPDX — expensive, and it runs on every build. Only inherit it
# for release builds, which are the only builds whose SBOM is consumed:
# promote.yml rebuilds from scratch at the release tag (it does not reuse
# nightly artifacts), so a nightly's SBOM can never feed a release. CI sets
# WENDYOS_SBOM=1 on tag/release builds; nightly and PR builds skip it.
INHERIT += "${@'create-spdx' if (d.getVar('WENDYOS_SBOM') or '0') == '1' else ''}"

INHERIT += " \
    uninative \
    "
